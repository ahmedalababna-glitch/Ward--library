<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0, col = C.glove, edge = C.gloveEdge) {
  const s = rx / 60;
  const fing = [[-27, -60, 13, 44, -6], [-9, -72, 14, 56, -2], [9, -70, 14, 54, 2], [26, -56, 12, 40, 7]].map(([fx, fy, w, hh, r]) => `<path transform="rotate(${r} ${fx} -20)" d="M ${fx - w / 2} -18 L ${fx - w / 2 + 1} ${fy + w / 2} A ${w / 2 - 1} ${w / 2 - 1} 0 0 1 ${fx + w / 2 - 1} ${fy + w / 2} L ${fx + w / 2} -18 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/>`).join("");
  return `<g filter="url(#sh)" transform="translate(${x} ${y}) rotate(${rot + 90}) scale(${s})">${fing}<path d="M -40 -6 C -58 -16, -70 -30, -64 -40 C -58 -48, -46 -38, -34 -26" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -38 -26 C -36 -40, 38 -40, 38 -24 L 34 30 C 28 46, -28 46, -34 30 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -26 -24 C -10 -30, 10 -30, 28 -22" fill="none" stroke="${edge}" stroke-width="2" opacity=".5"/><path d="M -30 46 L 30 46 L 34 74 L -34 74 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -32 52 h 64" stroke="${edge}" stroke-width="2" opacity=".5"/><path d="M -22 -20 C -24 0, -20 20, -12 32" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".35"/></g>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}


const ICON = {
  order: `<rect x="-20" y="-24" width="40" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="5"/><rect x="-10" y="-30" width="20" height="12" rx="3" fill="currentColor"/><path d="M -10 -4 h 20 M -10 8 h 14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`,
  child: `<circle cx="0" cy="-14" r="11" fill="currentColor"/><path d="M -16 26 C -16 4, 16 4, 16 26 Z" fill="currentColor"/>`,
  people: `<circle cx="-12" cy="-12" r="9" fill="currentColor"/><circle cx="12" cy="-12" r="9" fill="currentColor"/><path d="M -28 22 C -28 2, 4 2, 4 22 Z M -4 22 C -4 2, 28 2, 28 22 Z" fill="currentColor"/>`,
  doctor: `<path d="M -14 -24 v 18 a 14 14 0 0 0 28 0 v -18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M 0 8 v 8 a 10 10 0 0 0 20 0 v -6" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="20" cy="6" r="7" fill="currentColor"/>`,
  kit: `<rect x="-24" y="-14" width="48" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="5"/><path d="M -10 -14 v -8 h 20 v 8" fill="none" stroke="currentColor" stroke-width="5"/><path d="M 0 -4 v 18 M -9 5 h 18" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`,
  talk: `<path d="M -24 -20 h 48 v 30 h -26 l -12 12 v -12 h -10 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><path d="M -12 -6 h 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`,
  curtain: `<path d="M -26 -24 h 52" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M -22 -24 C -18 0, -26 10, -18 26 M -8 -24 C -4 0, -12 10, -4 26 M 22 -24 C 18 0, 26 10, 18 26" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`,
  heart: `<path d="M 0 22 C -30 2, -26 -22, -10 -22 C -2 -22, 0 -14, 0 -12 C 0 -14, 2 -22, 10 -22 C 26 -22, 30 2, 0 22 Z" fill="currentColor"/>`,
  shield: `<path d="M 0 -26 L 22 -18 V 0 C 22 14, 10 22, 0 26 C -10 22, -22 14, -22 0 V -18 Z" fill="none" stroke="currentColor" stroke-width="5"/><path d="M -9 0 l 6 7 l 12 -14" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`,
  eye: `<path d="M -26 0 C -14 -18, 14 -18, 26 0 C 14 18, -14 18, -26 0 Z" fill="none" stroke="currentColor" stroke-width="5"/><circle r="7" fill="currentColor"/>`,
  drop: `<path d="M 0 -24 C 12 -8, 18 2, 18 10 a 18 18 0 0 1 -36 0 C -18 2, -12 -8, 0 -24 Z" fill="currentColor"/>`
};
function iconFor(t) { t = t.toLowerCase();
  const m = [["order", "order"], ["indication", "order"], ["child", "child"], ["infant", "child"], ["gender", "people"], ["doctor", "doctor"], ["physician", "doctor"], ["equipment", "kit"], ["consent", "talk"], ["explain", "talk"], ["reassur", "talk"], ["privacy", "curtain"], ["dignity", "heart"], ["accountab", "shield"], ["meatus", "eye"], ["fluid", "drop"]];
  for (const [k, v] of m) if (t.includes(k)) return ICON[v]; return null; }
function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    let y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    if (window.SYNC && rows.length === window.SYNC.n && !window.SYNC.off) { const a = window.SYNC.at(i), r = window.SYNC.rt; p = seg(r, a - 0.2, a + 0.3); tk = seg(r, a + 0.4, a + 0.8); }
    const ic = iconFor(hd + " " + (sub || "")), red = col === C.red;
    const left = ic ? `<circle cx="72" cy="${h / 2}" r="44" fill="${red ? "#F6CFCB" : C.tealSoft}"/><g transform="translate(72 ${h / 2})" color="${red ? C.red : C.teal}">${ic}</g>` : (red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk));
    const right = ic ? (red ? cross(w - 60, h / 2, 18, tk) : tick(w - 60, h / 2, 0.5 + 0.5 * tk, tk)) : "";
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${red ? C.redSoft : "#F5F9FA"}" stroke="${C.line}" stroke-width="2"/><rect width="8" height="${h}" rx="4" fill="${red ? C.red : C.teal}" opacity="${tk}"/>${T(150, sub ? 62 : 82, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${left}${right}</g>`;
  }).join("");
}

// ---------- Urinary catheter scenes (Module 04, RMS.NCC.MW.F.010) ----------

const DEFS = `<defs>
<linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFA"/><stop offset="1" stop-color="#E7EFF1"/></linearGradient>
<linearGradient id="amberV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C98C3C"/><stop offset=".3" stop-color="#F6CF8A"/><stop offset=".45" stop-color="#FFF0CF"/><stop offset=".7" stop-color="#E5AE5E"/><stop offset="1" stop-color="#A9742C"/></linearGradient>
<linearGradient id="amberH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98C3C"/><stop offset=".3" stop-color="#F6CF8A"/><stop offset=".45" stop-color="#FFF0CF"/><stop offset=".7" stop-color="#E5AE5E"/><stop offset="1" stop-color="#A9742C"/></linearGradient>
<linearGradient id="glassH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#EAF3F7"/><stop offset=".6" stop-color="#F8FBFC"/><stop offset="1" stop-color="#D5E2E8"/></linearGradient>
<linearGradient id="tubeH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D8DE"/><stop offset=".35" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B7C9D0"/></linearGradient>
<linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D2B5"/><stop offset=".5" stop-color="#EBB792"/><stop offset="1" stop-color="#CF9671"/></linearGradient>
<radialGradient id="bladR" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FCE6E1"/><stop offset=".6" stop-color="#F2C3BA"/><stop offset="1" stop-color="#DE9A8F"/></radialGradient>
<radialGradient id="ballR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E3F1FA"/><stop offset="1" stop-color="#A9CBE0"/></radialGradient>
<linearGradient id="bagG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8F0F3"/><stop offset=".2" stop-color="#FFFFFF"/><stop offset=".8" stop-color="#F2F7F9"/><stop offset="1" stop-color="#D3E1E7"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1B3A40" flood-opacity=".16"/></filter>
<filter id="cardSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B3A40" flood-opacity=".14"/></filter>
</defs>`;
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));
const URINE = "#F2D25C";

// schematic bladder + urethra (front view, not to scale)
function bladder(o = {}) {
  let g = `<path d="M 380 170 C 380 90, 740 90, 740 170 C 760 300, 680 400, 600 420 L 520 420 C 440 400, 360 300, 380 170 Z" fill="url(#bladR)" stroke="#C97B70" stroke-width="5"/><path d="M 400 175 C 400 112, 720 112, 720 175 C 738 290, 666 382, 596 400 L 524 400 C 454 382, 382 290, 400 175 Z" fill="none" stroke="#D99288" stroke-width="2" stroke-dasharray="3 9" opacity=".7"/>`;
  if (o.urine) g += `<clipPath id="bl"><path d="M 380 170 C 380 90, 740 90, 740 170 C 760 300, 680 400, 600 420 L 520 420 C 440 400, 360 300, 380 170 Z"/></clipPath><rect x="360" y="${420 - 200 * o.urine}" width="400" height="300" fill="${URINE}" opacity=".55" clip-path="url(#bl)"/>`;
  g += `<path d="M 530 418 L 530 740 M 590 418 L 590 740" stroke="#D98C82" stroke-width="4"/><rect x="532" y="418" width="56" height="322" fill="#FBE6E2"/><rect x="532" y="418" width="10" height="322" fill="#F1C9C1" opacity=".7"/><rect x="578" y="418" width="10" height="322" fill="#F1C9C1" opacity=".7"/>`;
  g += `${T(770, 200, "Bladder", { size: 26, w: 700, fill: "#B0554A" })}${T(510, 600, "Urethra", { size: 24, fill: C.muted, anchor: "end" })}${T(510, 748, "Meatus", { size: 24, fill: C.muted, anchor: "end" })}`;
  return g;
}
// catheter seen in the urethra: tip at tipY, balloon size b (0..1), urine fill f (0..1)
function catheter(tipY, b = 0, f = 0) {
  // amber latex Foley: rounded tip, drainage eye, water-filled balloon
  let g = `<rect x="548" y="${tipY}" width="24" height="${900 - tipY}" rx="12" fill="url(#amberV)" stroke="#A9742C" stroke-width="2.5"/><line x1="554" y1="${tipY + 16}" x2="554" y2="900" stroke="#fff" stroke-width="3" opacity=".9"/>`;
  if (f > 0) g += `<rect x="553" y="${tipY + 20}" width="14" height="${(900 - tipY) * f}" rx="7" fill="${URINE}" opacity=".9"/>`;
  if (b > 0) g += `<ellipse cx="560" cy="${tipY + 44}" rx="${18 + 46 * b}" ry="${10 + 26 * b}" fill="url(#ballR)" fill-opacity=".95" stroke="#7FA9C6" stroke-width="3"/><ellipse cx="${548 - 20 * b}" cy="${tipY + 36}" rx="${8 * b}" ry="${4 * b}" fill="#fff" opacity=".9"/>`;
  g += `<ellipse cx="560" cy="${tipY + 16}" rx="5" ry="8" fill="#6E7B80"/>`;
  return g;
}
function syringe(x, y, vol, label, op = 1, sc = 0.8) {
  // clear Luer syringe, tip on the left; vol = water inside (0..1)
  const sx = 6 + 190 * vol;
  let g = `<g opacity="${op}" transform="translate(${x} ${y}) scale(${sc})"><path d="M -40 26 L 0 22 L 0 42 L -40 38 Z" fill="#F2F6F7" stroke="#8FA3AA" stroke-width="3"/><rect x="0" y="0" width="230" height="64" rx="10" fill="url(#glassH)" stroke="#8FA3AA" stroke-width="3"/>`;
  if (vol > 0.01) g += `<rect x="4" y="5" width="${sx - 4}" height="54" rx="6" fill="#CFE8F6"/>`;
  for (let i = 0; i <= 10; i++) g += `<line x1="${10 + i * 19}" y1="2" x2="${10 + i * 19}" y2="${i % 5 ? 12 : 22}" stroke="#4A5A60" stroke-width="2"/>`;
  g += `<rect x="${sx}" y="3" width="16" height="58" rx="5" fill="#3A3F44"/><rect x="${sx + 16}" y="25" width="236" height="14" fill="#fff" stroke="#9AA9AE" stroke-width="2"/><rect x="${sx + 248}" y="4" width="14" height="56" rx="5" fill="#fff" stroke="#9AA9AE" stroke-width="2"/><rect x="226" y="-16" width="12" height="96" rx="5" fill="#fff" stroke="#9AA9AE" stroke-width="2"/>`;
  g += `<rect x="6" y="6" width="218" height="10" rx="5" fill="#fff" opacity=".8"/>`;
  return g + `${T(115, -24, label, { size: 26, w: 800, anchor: "middle", fill: C.teal })}</g>`;
}
// Foley end: drainage funnel and colour-coded balloon valve (14 Fr = green)
function foleyEnd(x, y) {
  return `<path d="M ${x} ${y - 12} L ${x + 60} ${y - 16} L ${x + 120} ${y - 26} L ${x + 120} ${y + 26} L ${x + 60} ${y + 16} L ${x} ${y + 12} Z" fill="url(#amberH)" stroke="#A9742C" stroke-width="2.5"/>`;
}
// beige foam leg strap with a clip
function legStrap(x, y, op = 1) {
  return `<g opacity="${op}"><rect x="${x}" y="${y}" width="170" height="96" rx="40" fill="#F4EAD6" stroke="#CDB991" stroke-width="3"/><rect x="${x + 50}" y="${y + 24}" width="70" height="48" rx="12" fill="#E8EEF0" stroke="#8FA3AA" stroke-width="3"/><path d="M ${x + 58} ${y + 48} h 54" stroke="#8FA3AA" stroke-width="3"/></g>`;
}
// urine drainage bag: hanger, non-return valve, ml scale, bottom tap
function urineBag(x, y, level, op = 1) {
  let g = `<g opacity="${op}" transform="translate(${x} ${y})"><path d="M 20 -70 v 50 M 130 -70 v 50" stroke="#7D9097" stroke-width="6"/><path d="M 10 -76 h 140" stroke="#7D9097" stroke-width="8" stroke-linecap="round"/>`;
  g += `<path d="M 0 0 h 150 v 190 c 0 16 -10 26 -30 30 l -30 10 l -30 -10 c -20 -4 -30 -14 -30 -30 Z" fill="url(#bagG)" fill-opacity=".95" stroke="#8DA9B4" stroke-width="3"/>`;
  g += `<path d="M 4 ${200 - 150 * level} h 142 v ${150 * level - 10} c 0 12 -8 20 -26 24 l -30 9 l -30 -9 c -18 -4 -26 -12 -26 -24 Z" fill="${URINE}" opacity=".75"/>`;
  for (let i = 1; i <= 5; i++) g += `<line x1="112" y1="${200 - i * 32}" x2="146" y2="${200 - i * 32}" stroke="#6E8A94" stroke-width="2"/>${T(108, 206 - i * 32, String(i * 200), { size: 14, anchor: "end", fill: "#6E8A94" })}`;
  g += `<rect x="60" y="-14" width="30" height="22" rx="4" fill="#DCE8EC" stroke="#8DA9B4" stroke-width="2"/><path d="M 75 230 v 22" stroke="#8DA9B4" stroke-width="10"/><rect x="62" y="248" width="26" height="14" rx="4" fill="#3B8DB5"/>`;
  g += `<path d="M 16 14 v 160" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7"/>`;
  return g + `</g>`;
}

  const rows = [["Order / indication", "Dr name · retention"], ["Inserted", "30/10 · 10:15 · 14 Fr"], ["Balloon", "10 ml sterile water"], ["Urine", "450 ml · straw · clear"], ["Patient response", "Tolerated well"], ["Catheter care", "Meatal care done 18:00"], ["Deviations", "None · doctor informed if any"]];
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, "Catheter record", { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="520" y1="${y + 42}" x2="930" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(520, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;
} });
add(5, { kind: "end" });

SCENES.forEach(s => s.design = s.dur); const DURS = [6.83, 19.29, 11.2, 10.09, 13.08, 9.11, 14.79, 10.39, 7.68, 10.03, 11.54, 18.01, 12.57, 12.91, 11.37, 13.27, 4.48]; const SPEECH = [4.93, 17.39, 9.3, 8.19, 11.18, 7.21, 12.89, 8.49, 5.78, 8.13, 9.64, 16.11, 10.67, 11.01, 9.47, 11.37, 2.58]; const LEAD = 0.8; SCENES.forEach((s, i) => s.dur = DURS[i]);
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt, si) {
  const p = seg(lt, 0, 0.6);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 50} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}" filter="url(#sh)"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) { const pul = 1 + 0.04 * Math.sin(lt * 4) * (1 - seg(lt, 3, 4)); g += `<g transform="translate(1512 200) scale(${pul})"><rect x="-150" y="-26" width="300" height="52" rx="26" fill="${C.red}" filter="url(#sh)"/>${T(0, 10, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}</g>`; }
  g += `</g>`;
  const n = s.bullets.length, sp = SPEECH[si] || 6, t0 = LEAD + Math.min(1.6, sp * 0.18);
  const at = i => t0 + (sp - (t0 - LEAD)) * i / n;
  window.SYNC = { n, at, rt: lt };
  s.bullets.forEach((b, i) => {
    const q = seg(lt, at(i), at(i) + 0.45), act = lt >= at(i) && (i === n - 1 || lt < at(i + 1));
    const lines = b.split("\n"), hgt = lines.length * 46;
    g += `<g opacity="${q}" transform="translate(${(1 - q) * 24} 0)">`;
    if (act) g += `<rect x="1230" y="${y - 40}" width="640" height="${hgt + 16}" rx="14" fill="${s.warn ? C.redSoft : C.tealSoft}" opacity="${seg(lt, at(i), at(i) + 0.3)}"/><rect x="1230" y="${y - 40}" width="8" height="${hgt + 16}" rx="4" fill="${s.warn ? C.red : C.teal}"/>`;
    g += `<rect x="1252" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    lines.forEach(l => { g += T(1284, y, l, { size: 34, w: act ? 700 : 500, fill: act ? C.ink : "#3C5459" }); y += 46; });
    g += `</g>`; y += 26;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "URINARY CATHETER", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(385, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "Urinary", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "catheter", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Insertion, maintenance and removal \u00b7 step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 540)"><path d="M -160 -260 C -160 -340, 160 -340, 160 -260 C 170 -160, 90 -100, 0 -100 C -90 -100, -170 -160, -160 -260 Z" fill="#fff" opacity=".18" stroke="#fff" stroke-width="6"/><rect x="-14" y="-250" width="28" height="420" rx="14" fill="#fff"/><ellipse cx="0" cy="-200" rx="52" ry="30" fill="#BFE6E6" stroke="#fff" stroke-width="4"/><path d="M 0 170 C 0 260, 140 260, 160 200" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/><rect x="120" y="200" width="130" height="170" rx="22" fill="#fff" opacity=".9"/><rect x="128" y="290" width="114" height="72" rx="14" fill="#F2D25C"/></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review \u00b7 Module 04 \u00b7 RMS.NCC.MW.F.010 \u00b7 follow hospital policy", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow hospital policy and strict asepsis.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0, si = SCENES.length - 1;
  for (let i = 0; i < SCENES.length; i++) { const sc = SCENES[i]; if (t < acc + sc.dur) { s = sc; lt = t - acc; si = i; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = DEFS + `<rect width="1920" height="1080" fill="url(#bgG)"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    const tp = textPanel(s, lt, si);
    g += chrome(s);
    // camera: slow push-in, plus zoom to the key moment
    let z = 1 + 0.035 * clamp(lt / s.dur), cx = 560, cy = 420;
    (s.focus || []).forEach(([a, b, fx, fy, fz]) => { const k = seg(lt, a, a + 0.9) * (1 - seg(lt, b, b + 0.9)); z *= lerp(1, fz, k); cx = lerp(cx, fx, k); cy = lerp(cy, fy, k); });
    const tx = 560 - cx * z, ty = 420 - cy * z;
    const ci = seg(lt, 0, 0.55);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(${60 + 560 * (1 - lerp(0.96, 1, ci))} ${130 + 420 * (1 - lerp(0.96, 1, ci))}) scale(${lerp(0.96, 1, ci)})" opacity="${ci}"><rect width="1120" height="840" rx="28" fill="#fff" filter="url(#cardSh)"/><g clip-path="url(#card)"><rect width="1120" height="840" fill="#fff"/><g transform="translate(${tx} ${ty}) scale(${z})"><g filter="url(#sh)">${s.draw(Math.max(0, lt - 0.4) * s.design / Math.max(s.design, (SPEECH[si] || 0) + 0.6))}</g></g></g><rect width="1120" height="840" rx="28" fill="none" stroke="${C.line}" stroke-width="2"/></g>`;
    g += tp;
  }
  const fout = clamp((s.dur - lt) / 0.4), fin = clamp(lt / 0.25);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="#EEF4F5" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
