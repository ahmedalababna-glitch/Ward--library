<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0, col = C.glove, edge = C.gloveEdge) {
  // gloved hand seen from above: palm, four fingers and thumb, sized by rx
  const s = rx / 60;
  const f = [[-27, -64, 15, 46], [-9, -76, 15, 58], [9, -72, 15, 54], [27, -58, 14, 42]].map(([fx, fy, w, h]) => `<rect x="${fx - w / 2}" y="${fy}" width="${w}" height="${h}" rx="${w / 2}" fill="${col}" stroke="${edge}" stroke-width="2.5"/>`).join("");
  return `<g transform="translate(${x} ${y}) rotate(${rot + 90}) scale(${s})">${f}<rect x="-62" y="-14" width="44" height="17" rx="8.5" transform="rotate(-35 -40 -6)" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -38 -26 C -38 -40, 38 -40, 38 -26 L 36 34 C 30 48, -30 48, -36 34 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -30 48 L 30 48 L 32 70 L -32 70 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/></g>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}

function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    const y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${col === C.red ? C.redSoft : C.bg}"/>${T(150, sub ? 62 : h / 2 + 13, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${col === C.red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk)}</g>`;
  }).join("");
}

// ---------- Tracheostomy care scenes (Module 04, RMS.NCC.MW.F.003) ----------
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));
const ST = { x: 560, y: 470 };

// foam tube-holder strap (one side), from the flange slot up around the neck
function strap(side, col = "#FFFFFF", edge = "#7FB2D6", dash = 1) {
  const x0 = side < 0 ? 402 : 718, x1 = side < 0 ? 300 : 820;
  const d = `M ${x0} ${ST.y} C ${x0 + side * 50} ${ST.y - 10}, ${x1} ${ST.y - 50}, ${x1} ${ST.y - 130} L ${x1} ${ST.y - 300}`;
  const da = dash < 1 ? ` stroke-dasharray="${520 * dash} 600"` : "";
  return `<path d="${d}" fill="none" stroke="${edge}" stroke-width="34" stroke-linecap="round"${da}/><path d="${d}" fill="none" stroke="${col}" stroke-width="27" stroke-linecap="round"${da}/>`;
}
// front view of the neck with a tracheostomy tube: flange with tie slots, 15 mm connector,
// inner cannula hub, pilot line and pilot balloon, foam tube holder, keyhole dressing
function neck(o = {}) {
  let g = `<rect x="0" y="0" width="1120" height="840" fill="#EEF4F6"/>`;
  g += `<path d="M 330 0 L 790 0 L 800 300 C 820 520, 900 640, 1120 700 L 1120 840 L 0 840 L 0 700 C 220 640, 300 520, 320 300 Z" fill="${C.skinT}" stroke="${C.skinEdge}" stroke-width="3"/>`;
  g += `<path d="M 420 0 Q 560 140 700 0" fill="${C.skin}" opacity=".5"/>${T(560, 60, "Chin", { size: 22, fill: C.muted, anchor: "middle" })}`;
  const tp = o.tape ?? 1;
  if (tp) g += `<g opacity="${tp}">${strap(-1, o.tapeCol || "#FFFFFF")}${strap(1, o.tapeCol || "#FFFFFF")}</g>`;
  if (o.dress) {
    const dc = o.dressCol || "#FFFFFF";
    let w = "";
    for (let i = 1; i < 9; i++) w += `<line x1="${450 + i * 25}" y1="${ST.y - 40}" x2="${450 + i * 25}" y2="${ST.y + 110}" stroke="#D9E1E4" stroke-width="2"/><line x1="450" y1="${ST.y - 40 + i * 17}" x2="670" y2="${ST.y - 40 + i * 17}" stroke="#D9E1E4" stroke-width="2"/>`;
    g += `<g opacity="${o.dress}"><rect x="450" y="${ST.y - 40}" width="220" height="150" rx="10" fill="${dc}" stroke="#C3CDD1" stroke-width="3"/>${w}<path d="M 560 ${ST.y + 110} L 560 ${ST.y + 10}" stroke="#AEB9BD" stroke-width="5"/>${T(615, ST.y + 98, "Keyhole", { size: 16, fill: "#8A989D", anchor: "middle" })}</g>`;
  }
  if (o.stomaOnly) {
    g += `<ellipse cx="${ST.x}" cy="${ST.y}" rx="46" ry="34" fill="#C9786C" stroke="#A85A4F" stroke-width="3"/><ellipse cx="${ST.x}" cy="${ST.y}" rx="24" ry="16" fill="#5B2A25"/>`;
    return g;
  }
  // pilot line and pilot balloon (cuffed tube)
  g += `<path d="M 500 ${ST.y + 30} C 480 ${ST.y + 90}, 420 ${ST.y + 100}, 350 ${ST.y + 150}" fill="none" stroke="#AFC6CF" stroke-width="7"/><path d="M 500 ${ST.y + 30} C 480 ${ST.y + 90}, 420 ${ST.y + 100}, 350 ${ST.y + 150}" fill="none" stroke="#EEF6F9" stroke-width="3"/>`;
  g += `<ellipse cx="350" cy="${ST.y + 175}" rx="18" ry="26" fill="#E3F1F8" fill-opacity=".9" stroke="#7FA9C6" stroke-width="3"/><rect x="341" y="${ST.y + 198}" width="18" height="26" rx="4" fill="#3E7CC4"/>`;
  // flange: translucent wing with slots for the ties
  g += `<path d="M 392 ${ST.y - 30} C 470 ${ST.y - 62}, 650 ${ST.y - 62}, 728 ${ST.y - 30} C 744 ${ST.y - 14}, 744 ${ST.y + 14}, 728 ${ST.y + 30} C 650 ${ST.y + 62}, 470 ${ST.y + 62}, 392 ${ST.y + 30} C 376 ${ST.y + 14}, 376 ${ST.y - 14}, 392 ${ST.y - 30} Z" fill="#D6EAF4" fill-opacity=".92" stroke="#6E9DB5" stroke-width="4"/>`;
  g += `<rect x="412" y="${ST.y - 22}" width="16" height="44" rx="8" fill="#9DB9C6"/><rect x="692" y="${ST.y - 22}" width="16" height="44" rx="8" fill="#9DB9C6"/>`;
  g += `<path d="M 420 ${ST.y - 40} C 480 ${ST.y - 52}, 520 ${ST.y - 54}, 540 ${ST.y - 54}" fill="none" stroke="#fff" stroke-width="5" opacity=".8" stroke-linecap="round"/>`;
  g += T(470, ST.y + 8, "8.0", { size: 20, w: 800, fill: "#4C7489", anchor: "middle" }) + T(650, ST.y + 8, "ID", { size: 18, w: 700, fill: "#4C7489", anchor: "middle" });
  // 15 mm connector with the inner cannula hub
  g += `<circle cx="${ST.x}" cy="${ST.y}" r="58" fill="#F4F7F8" stroke="#8DA9B4" stroke-width="4"/><circle cx="${ST.x}" cy="${ST.y}" r="44" fill="#E7EEF1" stroke="#B3C4CA" stroke-width="3"/>`;
  if (o.inner ?? 1) g += `<circle cx="${ST.x}" cy="${ST.y}" r="38" fill="#3BA7B8" stroke="#22808F" stroke-width="3"/><rect x="${ST.x - 48}" y="${ST.y - 8}" width="22" height="16" rx="5" fill="#3BA7B8" stroke="#22808F" stroke-width="2"/><rect x="${ST.x + 26}" y="${ST.y - 8}" width="22" height="16" rx="5" fill="#3BA7B8" stroke="#22808F" stroke-width="2"/>`;
  g += `<circle cx="${ST.x}" cy="${ST.y}" r="26" fill="#2E3B40"/><path d="M ${ST.x - 34} ${ST.y - 28} A 44 44 0 0 1 ${ST.x + 10} ${ST.y - 44}" fill="none" stroke="#fff" stroke-width="5" opacity=".75" stroke-linecap="round"/>`;
  return g;
}

add(4.5, { kind: "title" });
add(9, { step: 1, title: ["Know the", "tube"], bullets: ["Indications for a\ntracheostomy", "Cuffed, uncuffed,\nfenestrated", "Outer and inner cannula,\nflange, cuff, pilot balloon"], draw: lt => {
  const p = seg(lt, 0.4, 1.4), inn = seg(lt, 2.0, 2.8), cuff = seg(lt, 3.0, 3.6), pil = seg(lt, 3.6, 4.2);
  const D = "M 300 175 C 300 360, 380 480, 560 520";
  let g = `<g opacity="${p}" transform="translate(100 60) scale(1.3)">`;
  // outer cannula: clear PVC with blue X-ray line
  g += `<path d="${D}" fill="none" stroke="#8FB3C2" stroke-width="66" stroke-linecap="butt"/><path d="${D}" fill="none" stroke="#E4F1F6" stroke-width="60"/><path d="${D}" fill="none" stroke="#FFFFFF" stroke-width="10" opacity=".85" transform="translate(-14 2)"/><path d="${D}" fill="none" stroke="#3E7CC4" stroke-width="4" transform="translate(16 -6)"/>`;
  // inner cannula sliding in
  g += `<path d="${D}" fill="none" stroke="#BCD7E0" stroke-width="40" stroke-dasharray="${470 * inn} 600" opacity="${inn > 0 ? 1 : 0}"/>`;
  // cuff
  g += `<g opacity="${cuff}"><ellipse cx="470" cy="482" rx="78" ry="56" transform="rotate(25 470 482)" fill="#EAF4FB" fill-opacity=".75" stroke="#7FA9C6" stroke-width="4"/><path d="${D}" fill="none" stroke="#E4F1F6" stroke-width="56" stroke-dasharray="0 330 160 600" opacity=".5"/></g>`;
  // bevelled tip
  g += `<path d="M 548 488 L 572 552" stroke="#8FB3C2" stroke-width="6" stroke-linecap="round"/>`;
  // flange (wing) with tie slots and size, 15 mm connector
  g += `<path d="M 130 150 C 220 128, 380 128, 470 150 C 486 160, 486 186, 470 196 C 380 214, 220 214, 130 196 C 114 186, 114 160, 130 150 Z" fill="#D6EAF4" fill-opacity=".95" stroke="#6E9DB5" stroke-width="4"/><rect x="146" y="158" width="34" height="30" rx="12" fill="#9DB9C6"/><rect x="420" y="158" width="34" height="30" rx="12" fill="#9DB9C6"/>${T(240, 182, "8.0", { size: 20, w: 800, fill: "#4C7489", anchor: "middle" })}`;
  g += `<rect x="262" y="88" width="76" height="62" rx="8" fill="#F4F7F8" stroke="#8DA9B4" stroke-width="4"/><line x1="262" y1="110" x2="338" y2="110" stroke="#C3D0D5" stroke-width="3"/>`;
  g += `<g opacity="${inn}"><rect x="${256}" y="${70 - 40 * (1 - inn)}" width="88" height="26" rx="8" fill="#3BA7B8" stroke="#22808F" stroke-width="3"/></g>`;
  // pilot line, pilot balloon and valve
  g += `<g opacity="${pil}"><path d="M 330 230 C 420 200, 520 90, 600 70" fill="none" stroke="#AFC6CF" stroke-width="7"/><path d="M 330 230 C 420 200, 520 90, 600 70" fill="none" stroke="#EEF6F9" stroke-width="3"/><ellipse cx="630" cy="62" rx="34" ry="24" fill="#E3F1F8" fill-opacity=".9" stroke="#7FA9C6" stroke-width="4"/><rect x="662" y="50" width="36" height="24" rx="5" fill="#3E7CC4"/></g></g>`;
  g += callout(250, 370, "Flange", seg(lt, 1.4, 1.8), C.teal) + callout(860, 470, "Inner cannula", seg(lt, 2.4, 2.8), C.teal) + callout(940, 760, "Cuff (cuffed tubes)", seg(lt, 3.2, 3.6), C.teal) + callout(960, 210, "Pilot balloon", seg(lt, 3.8, 4.2), C.teal);
  return g;
} });
add(9, { step: 2, title: ["Know the", "complications"], bullets: ["Infection, obstruction,\naccidental decannulation", "Bleeding", "Know the emergency actions", "Spot respiratory distress early"], draw: lt => checkCards([["Obstruction / blockage", "Act at once: emergency plan"], ["Accidental decannulation", "Emergency kit at the bedside"], ["Bleeding", "Report and act promptly"], ["Infection", "Redness, discharge, fever"]], lt, 80, 960, 140, 170, 110, C.red) + callout(560, 800, "Watch for respiratory distress", seg(lt, 3.4, 4.0), C.red) });
add(9, { step: 3, title: ["Keep the", "airway clear"], bullets: ["Suctioning: correct depth,\nduration and frequency", "Humidification and\noxygen as prescribed", "Work with respiratory\ntherapy and ENT"], draw: lt => checkCards([["Suctioning", "Correct depth, duration and frequency"], ["Humidification", "Keeps secretions thin"], ["Oxygen delivery", "Method suited to the tracheostomy"], ["Team", "Respiratory therapy, ENT"]], lt) });
add(9, { step: 4, title: ["Prepare the", "patient"], bullets: ["Check the physician's order", "Two patient identifiers", "Explain (family if the\npatient is unconscious)", "Equipment, privacy,\nsemi-Fowler's or sitting"], draw: lt => checkCards([["Physician's order checked", ""], ["Two patient identifiers", "As per RMS policy"], ["Procedure explained", "Family if the patient is unconscious"], ["Equipment organised", ""], ["Privacy provided", ""], ["Semi-Fowler's or sitting", ""]], lt, 80, 960, 104, 122, 50) });
add(8, { step: 5, title: ["Remove the", "soiled dressing"], bullets: ["Unsterile gloves on", "Remove the soiled\ndressing around the tube", "Look at the stoma and skin"], draw: lt => {
  const r = seg(lt, 1.0, 3.0);
  let g = neck({ dress: 1 - r, dressCol: "#EFE7C6" });
  g += `<g opacity="${seg(lt, 0.4, 1.0) * (1 - r)}">${glove(760, 600, 70, 44, -20)}</g>`;
  return g + callout(560, 720, "Soiled dressing out", seg(lt, 1.2, 1.6), C.teal);
} });
add(10, { step: 6, crit: true, title: ["Change the tapes:", "hold the tube"], bullets: ["Hold the tube in place\nthe whole time", "Untie the soiled tape;\nreplace it immediately", "Two people may help"], draw: lt => {
  const old = 1 - seg(lt, 1.6, 2.6), nw = seg(lt, 3.0, 4.2);
  let g = neck({ tape: 0 });
  g += `<g opacity="${old}">${strap(-1, "#E6DDB8", "#C9B98A")}${strap(1, "#E6DDB8", "#C9B98A")}</g>`;
  if (nw > 0) g += `${strap(-1, "#FFFFFF", "#7FB2D6", nw)}${strap(1, "#FFFFFF", "#7FB2D6", nw)}`;
  g += `<g opacity="${seg(lt, 0.4, 1.0)}">${glove(470, ST.y - 10, 66, 40, 10)}${glove(650, ST.y - 10, 66, 40, -10)}</g>`;
  return g + callout(560, 200, "Hold the tube in place", seg(lt, 0.8, 1.2), C.red) + callout(560, 720, "New tape at once", seg(lt, 3.2, 3.6), C.teal);
} });
add(10, { step: 7, crit: true, title: ["Clean the", "stoma aseptically"], bullets: ["Remove unsterile gloves,\nwash hands, sterile gloves", "Antibacterial solution\nand normal saline", "Never let solution enter\nthe tracheostomy"], draw: lt => {
  let g = neck({});
  const sp = seg(lt, 1.6, 4.6); let path = ""; const n = 100;
  for (let i = 0; i <= n * sp; i++) { const a = i / n * Math.PI * 4, rx = 120 + i / n * 70, ry = 70 + i / n * 40; path += (i ? "L" : "M") + (ST.x + rx * Math.cos(a)).toFixed(1) + " " + (ST.y + ry * Math.sin(a)).toFixed(1) + " "; }
  if (path) g += `<path d="${path}" fill="none" stroke="${C.teal}" stroke-width="6" stroke-linecap="round" opacity=".8"/>`;
  g += `<g opacity="${seg(lt, 5.0, 5.6)}"><circle cx="${ST.x}" cy="${ST.y}" r="70" fill="none" stroke="${C.red}" stroke-width="8"/>${cross(ST.x, ST.y, 30)}</g>`;
  return g + callout(560, 200, "Sterile gloves · aseptic technique", seg(lt, 0.4, 0.9), C.teal) + callout(560, 720, "No solution into the stoma", seg(lt, 5.2, 5.6), C.red);
} });
add(9, { step: 8, title: ["New dressing", "and finish"], bullets: ["Replace the dressing\n(Sofratulle if ordered)", "Infected wound: antiseptic,\nthen dry", "Comfortable position; clear\nthe trolley; wash hands"], draw: lt => {
  let g = neck({ dress: seg(lt, 0.8, 2.0) });
  return g + callout(560, 720, "Keyhole dressing under the flange", seg(lt, 2.0, 2.4), C.teal) + callout(560, 200, "Sofratulle if ordered", seg(lt, 3.0, 3.4), C.teal);
} });
add(8, { step: 9, title: ["Care for the", "person"], bullets: ["Calm and reassuring", "Watch breathing closely;\nrespond to change", "Empathy, respect, dignity", "Strict infection control"], draw: lt => checkCards([["Calm and reassuring", "Minimise anxiety"], ["Vigilant", "Respond to any breathing change"], ["Empathy and dignity", "Respect at all times"], ["Clear team communication", "During every intervention"]], lt) });
add(9, { step: 10, title: ["Document and", "report"], bullets: ["Cleaning, suctioning,\ndressing in the EMR", "Tube type, size, condition;\nstoma site", "Secretions: amount, colour,\nconsistency, odour", "Report bleeding, infection,\ndisplacement; hand over"], draw: lt => {
  const rows = [["Tube", "Cuffed · size 8 · secure"], ["Stoma", "Clean, no redness"], ["Care given", "Cleaned · tapes · dressing"], ["Suction", "x2 · 10:00 / 14:00"], ["Secretions", "Moderate · white · thin"], ["Education", "Family shown tape care"], ["Handover", "Emergency kit at bedside"]];
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, "Tracheostomy record", { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="490" y1="${y + 42}" x2="940" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(490, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;
} });
add(5, { kind: "end" });

const DURS = [5.81, 13.55, 15.26, 14.17, 19.48, 8, 11.68, 15.6, 15.03, 11.65, 20.44, 5]; SCENES.forEach((s, i) => s.dur = DURS[i]);
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt) {
  const p = seg(lt, 0, 0.5);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 40} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) g += `<rect x="1362" y="174" width="300" height="52" rx="26" fill="${C.red}"/>${T(1512, 210, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}`;
  g += `</g>`;
  s.bullets.forEach((b, i) => {
    const q = seg(lt, 0.6 + i * 0.5, 1.0 + i * 0.5);
    g += `<g opacity="${q}"><rect x="1250" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    b.split("\n").forEach(l => { g += T(1284, y, l, { size: 34, w: 500 }); y += 46; });
    g += `</g>`; y += 22;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "TRACHEOSTOMY CARE", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(405, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "Tracheostomy", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "care", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Stoma care, tapes and dressing \u00b7 step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 540)"><circle r="190" fill="#fff" opacity=".12"/><path d="M -150 -30 Q 0 -60 150 -30 L 150 40 Q 0 70 -150 40 Z" fill="#fff" opacity=".9"/><circle r="56" fill="#BFE6E6" stroke="#fff" stroke-width="6"/><circle r="28" fill="#0B6E75"/></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review \u00b7 Module 04 \u00b7 RMS.NCC.MW.F.003 \u00b7 follow hospital policy", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow hospital policy and aseptic technique.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0;
  for (const sc of SCENES) { if (t < acc + sc.dur) { s = sc; lt = t - acc; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = `<rect width="1920" height="1080" fill="${C.bg}"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    g += chrome(s);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(60 130)"><rect width="1120" height="840" rx="28" fill="#fff" stroke="${C.line}" stroke-width="2"/><g clip-path="url(#card)">${s.draw(lt)}</g></g>`;
    g += textPanel(s, lt);
  }
  // fade from previous scene
  const fin = clamp(lt / 0.35), fout = clamp((s.dur - lt) / 0.35);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="${C.bg}" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
</body></html>
