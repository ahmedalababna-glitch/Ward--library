<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0, col = C.glove, edge = C.gloveEdge) {
  // gloved hand seen from above: palm, four fingers and thumb, sized by rx
  const s = rx / 60;
  const f = [[-27, -64, 15, 46], [-9, -76, 15, 58], [9, -72, 15, 54], [27, -58, 14, 42]].map(([fx, fy, w, h]) => `<rect x="${fx - w / 2}" y="${fy}" width="${w}" height="${h}" rx="${w / 2}" fill="${col}" stroke="${edge}" stroke-width="2.5"/>`).join("");
  return `<g transform="translate(${x} ${y}) rotate(${rot + 90}) scale(${s})">${f}<rect x="-62" y="-14" width="44" height="17" rx="8.5" transform="rotate(-35 -40 -6)" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -38 -26 C -38 -40, 38 -40, 38 -26 L 36 34 C 30 48, -30 48, -36 34 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -30 48 L 30 48 L 32 70 L -32 70 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/></g>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}

function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    const y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${col === C.red ? C.redSoft : C.bg}"/>${T(150, sub ? 62 : h / 2 + 13, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${col === C.red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk)}</g>`;
  }).join("");
}

// ---------- Central line scenes (Module 04, RMS.NCC.MW.F.001) ----------
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));

// front view of right upper chest with an inserted multi-lumen catheter
function chestSite(o = {}) {
  let g = `<rect x="0" y="0" width="1120" height="840" fill="${C.skinT}"/><path d="M 0 0 H 1120 V 840 H 0 Z" fill="url(#cg)"/><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset="1" stop-color="${C.skin}"/></linearGradient></defs>`;
  g += `<path d="M 80 300 C 300 250, 520 250, 760 300" fill="none" stroke="${C.skinEdge}" stroke-width="5" opacity=".5"/>${T(90, 280, "Clavicle", { size: 24, fill: C.muted })}`;
  const out = o.out || 0; // 0 = fully in, 1 = removed
  g += `<path d="M 500 380 L ${lerp(500, 380, 1 - out)} ${lerp(380, 560, 1 - out)}" stroke="#fff" stroke-width="10" stroke-dasharray="14 10" opacity="${0.6 * (1 - out)}"/>`;
  const hx = 500 + out * 260, hy = 380 - out * 160;
  if (out > 0) g += `<line x1="${hx}" y1="${hy}" x2="${hx - 216 * out}" y2="${hy + 324 * out}" stroke="#93A7AE" stroke-width="11" stroke-linecap="round"/><line x1="${hx}" y1="${hy}" x2="${hx - 216 * out}" y2="${hy + 324 * out}" stroke="#F4F8F9" stroke-width="6" stroke-linecap="round"/>`;
  g += `<g transform="translate(${hx} ${hy}) rotate(-35)"><rect x="0" y="-11" width="70" height="22" rx="10" fill="#F4F8F9" stroke="#93A7AE" stroke-width="3"/><path d="M 60 -14 L 70 -34 L 120 -40 L 120 40 L 70 34 L 60 14 Z" fill="#DDE6E9" stroke="#93A7AE" stroke-width="3"/><rect x="74" y="-50" width="26" height="14" rx="5" fill="#DDE6E9" stroke="#93A7AE" stroke-width="2"/><rect x="74" y="36" width="26" height="14" rx="5" fill="#DDE6E9" stroke="#93A7AE" stroke-width="2"/>`;
  // three clear extension lumens: colour-coded slide clamp + Luer hub + clear needle-free connector
  [["#8B5A2B", -22], ["#3B6FD6", 0], ["#E9E9E9", 22]].forEach(([c, dy]) => { const y2 = dy * 2.4;
    g += `<line x1="120" y1="${dy * 0.8}" x2="250" y2="${y2}" stroke="#93A7AE" stroke-width="13" stroke-linecap="round"/><line x1="120" y1="${dy * 0.8}" x2="250" y2="${y2}" stroke="#F4F8F9" stroke-width="8" stroke-linecap="round"/>`;
    g += `<rect x="168" y="${(dy * 0.8 + y2) / 2 - 15}" width="30" height="30" rx="5" fill="${c}" stroke="#6E7B80" stroke-width="2"/>`;
    g += `<rect x="248" y="${y2 - 13}" width="30" height="26" rx="5" fill="${c}" stroke="#6E7B80" stroke-width="2"/><rect x="276" y="${y2 - 11}" width="30" height="22" rx="7" fill="#EEF6F8" fill-opacity=".9" stroke="#8FA3AA" stroke-width="2"/>`; });
  g += `</g>`;
  if (o.dress) g += `<g opacity="${o.dress}"><rect x="400" y="310" width="240" height="170" rx="18" fill="#EAF6FB" fill-opacity=".35" stroke="#AFC4CC" stroke-width="3"/><rect x="412" y="322" width="216" height="146" rx="12" fill="none" stroke="#fff" stroke-width="6" opacity=".7"/><path d="M 430 340 l 60 -10" stroke="#fff" stroke-width="5" opacity=".8" stroke-linecap="round"/><rect x="420" y="446" width="110" height="26" rx="5" fill="#fff" stroke="#AFC4CC" stroke-width="2"/>${T(475, 465, "Date / time", { size: 15, w: 700, anchor: "middle", fill: C.muted })}</g>`;
  return g;
}
function seqCards(st, lt, t0 = 0.5, step = 0.8, y = 260, hi = -1) {
  let g = ""; const w = 1040 / st.length;
  st.forEach(([h, s], i) => { const x = 40 + i * w, p = seg(lt, t0 + i * step, t0 + 0.5 + i * step), on = i === hi;
    g += `<g opacity="${p}" transform="translate(${x} ${y + (1 - p) * 30})"><rect width="${w - 22}" height="270" rx="22" fill="${on ? C.redSoft : C.bg}"/><circle cx="${(w - 22) / 2}" cy="70" r="40" fill="${on ? C.red : C.teal}"/>${T((w - 22) / 2, 86, String(i + 1), { size: 40, w: 800, anchor: "middle", fill: "#fff" })}${T((w - 22) / 2, 170, h, { size: 28, w: 800, anchor: "middle" })}${s.split("\n").map((l, k) => T((w - 22) / 2, 210 + k * 30, l, { size: 23, anchor: "middle", fill: C.muted })).join("")}</g>`;
    if (i < st.length - 1) g += `<g opacity="${p}">${arrow(x + w - 21, y + 135, x + w - 3, y + 135, C.muted, 4)}</g>`; });
  return g;
}
function grid4(items, lt) {
  return items.map(([h, s], i) => { const x = 60 + (i % 2) * 510, y = 90 + Math.floor(i / 2) * 340, p = seg(lt, 0.3 + i * 0.5, 0.8 + i * 0.5);
    return `<g opacity="${p}" transform="translate(${x} ${y + (1 - p) * 30})"><rect width="490" height="310" rx="24" fill="${C.tealSoft}"/><circle cx="245" cy="115" r="62" fill="${C.teal}"/>${T(245, 132, String(i + 1), { size: 52, w: 800, anchor: "middle", fill: "#fff" })}${T(245, 235, h, { size: 40, w: 800, anchor: "middle" })}${T(245, 278, s, { size: 28, anchor: "middle", fill: C.muted })}</g>`; }).join("");
}

add(4.5, { kind: "title" });
add(8, { step: 1, title: ["Know the", "central lines"], bullets: ["Indications, types and\ninsertion sites", "PICC, tunnelled,\nnon-tunnelled, implantable port", "Indications for\nCVP monitoring"], draw: lt => grid4([["PICC", "Inserted in the arm"], ["Tunnelled", "Long-term, under the skin"], ["Non-tunnelled", "Short-term, e.g. neck"], ["Implantable port", "Under the skin, accessed"]], lt) });
add(8, { step: 2, title: ["Know the", "risks"], bullets: ["Aseptic technique in\nevery phase", "Central line bundle\nreduces CRBSI", "Air embolism, occlusion,\nsite infection", "Spot early signs and act"], draw: lt => checkCards([["Aseptic technique", "Insertion, maintenance and removal"], ["Central line bundle", "Reduces bloodstream infection (CRBSI)"], ["Air embolism", "Never leave a lumen open to air"], ["Occlusion · site infection", "Spot early signs, act, report"]], lt, 80, 960, 140, 170, 110, C.teal) });
add(9, { step: 3, title: ["Prepare to", "assist insertion"], bullets: ["Check the physician's order", "Explain; consent obtained", "Equipment and transducer set", "Hand hygiene, privacy,\nposition"], draw: lt => checkCards([["Physician's order checked", ""], ["Explained · consent obtained", "Family if the patient is unconscious"], ["Equipment assembled", ""], ["Transducer set prepared", ""], ["Privacy and positioning", ""], ["Hand hygiene", ""]], lt, 80, 960, 104, 122, 50) });
add(9, { step: 4, crit: true, title: ["Full sterile", "barrier"], bullets: ["Hand hygiene", "Sterile gloves, gown,\nhead cover, mask", "Face shield or eye protection", "Start the central line bundle"], draw: lt => {
  let g = `<g transform="translate(560 470)"><circle cx="0" cy="-230" r="80" fill="${C.skin}" stroke="${C.skinEdge}" stroke-width="3"/><path d="M -170 -120 Q 0 -170 170 -120 L 200 330 L -200 330 Z" fill="#7FB5C9" stroke="#5E93A8" stroke-width="3"/>`;
  const cap = seg(lt, 1.0, 1.6), mask = seg(lt, 1.8, 2.4), sh = seg(lt, 2.6, 3.2), gl = seg(lt, 3.4, 4.0);
  g += `<path d="M -84 -250 Q 0 -350 84 -250 Z" fill="#7FB5C9" opacity="${cap}"/><rect x="-60" y="-215" width="120" height="60" rx="18" fill="#DCEFF5" stroke="#9DB9C3" stroke-width="3" opacity="${mask}"/><rect x="-96" y="-290" width="192" height="150" rx="40" fill="#E8F6FB" opacity="${0.45 * sh}" stroke="#9DB9C3" stroke-width="3" stroke-opacity="${sh}"/>`;
  g += `<g opacity="${gl}"><ellipse cx="-230" cy="120" rx="48" ry="34" fill="#E7F0D8" stroke="#9AB37A" stroke-width="3"/><ellipse cx="230" cy="120" rx="48" ry="34" fill="#E7F0D8" stroke="#9AB37A" stroke-width="3"/></g></g>`;
  g += callout(230, 150, "Head cover", cap, C.teal) + callout(890, 230, "Mask", mask, C.teal) + callout(890, 140, "Face shield", sh, C.teal) + callout(890, 680, "Sterile gloves + gown", gl, C.teal);
  return g + callout(560, 800, "Central line bundle started", seg(lt, 4.6, 5.2), C.green);
} });
add(8, { step: 5, crit: true, title: ["Sterile", "set-up"], bullets: ["Pour chlorhexidine 2% in\n70% alcohol, and NS 0.9%,\ninto the tray", "Open extra items onto\nthe sterile drape", "Sterile technique throughout"], draw: lt => {
  const f1 = seg(lt, 0.8, 2.2), f2 = seg(lt, 2.6, 4.0);
  let g = `<rect x="100" y="140" width="920" height="560" rx="24" fill="#CFE7D8" stroke="#7FAF92" stroke-width="4"/>${T(560, 190, "Sterile drape", { size: 28, w: 800, anchor: "middle", fill: "#2F6E4A" })}`;
  g += `<rect x="200" y="260" width="420" height="300" rx="20" fill="#fff" stroke="#B9C3C8" stroke-width="3"/><rect x="230" y="300" width="160" height="220" rx="14" fill="#F3F6F7" stroke="#C9D3D6" stroke-width="3"/><rect x="430" y="300" width="160" height="220" rx="14" fill="#F3F6F7" stroke="#C9D3D6" stroke-width="3"/>`;
  g += `<rect x="234" y="${516 - 200 * f1}" width="152" height="${200 * f1}" rx="10" fill="#E9B8D8" opacity=".8"/><rect x="434" y="${516 - 200 * f2}" width="152" height="${200 * f2}" rx="10" fill="#BFE3F2" opacity=".9"/>`;
  g += T(310, 600, "Chlorhexidine 2%", { size: 24, w: 700, anchor: "middle" }) + T(310, 630, "+ 70% alcohol", { size: 22, anchor: "middle", fill: C.muted }) + T(510, 600, "NS 0.9%", { size: 24, w: 700, anchor: "middle" });
  const it = seg(lt, 4.4, 5.4);
  g += `<g opacity="${it}" transform="translate(${(1 - it) * 80} 0)">${[0, 1].map(k => `<g transform="translate(700 ${280 + k * 70})"><path d="M -24 16 L 0 13 L 0 27 L -24 24 Z" fill="#F2F6F7" stroke="#8FA3AA" stroke-width="2"/><rect x="0" y="0" width="150" height="40" rx="7" fill="#F4F9FB" stroke="#8FA3AA" stroke-width="2.5"/><rect x="4" y="4" width="${k ? 100 : 60}" height="32" rx="4" fill="#CFE8F6"/><rect x="${k ? 104 : 64}" y="2" width="10" height="36" rx="3" fill="#3A3F44"/><rect x="${k ? 114 : 74}" y="16" width="${k ? 60 : 100}" height="9" fill="#fff" stroke="#9AA9AE" stroke-width="1.5"/></g>`).join("")}<rect x="690" y="430" width="110" height="90" rx="6" fill="#fff" stroke="#C9D3D6" stroke-width="2.5"/>${[1, 2, 3].map(k => `<line x1="${690 + k * 27}" y1="432" x2="${690 + k * 27}" y2="518" stroke="#E2E8EA" stroke-width="2"/><line x1="692" y1="${430 + k * 22}" x2="798" y2="${430 + k * 22}" stroke="#E2E8EA" stroke-width="2"/>`).join("")}<rect x="820" y="430" width="130" height="90" rx="12" fill="#EAF6FB" stroke="#AFC4CC" stroke-width="2.5"/>${T(885, 482, "Dressing", { size: 18, w: 700, anchor: "middle", fill: "#4F7682" })}${T(745, 545, "Gauze", { size: 18, w: 700, anchor: "middle", fill: "#2F6E4A" })}${T(800, 270, "Syringes", { size: 18, w: 700, anchor: "middle", fill: "#2F6E4A" })}</g>`;
  return g;
} });
add(10, { step: 6, title: ["During and", "after insertion"], bullets: ["Monitor vital signs\nand heart rhythm", "Clean site; let antiseptic\nair-dry completely", "Secure; transparent dressing", "Chest X-ray; reposition;\nhand hygiene"], draw: lt => {

  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="12" stroke-linecap="round"/><line x1="${x0}" y1="${y}" x2="${lerp(x0, x1, p)}" y2="${y}" stroke="${C.teal}" stroke-width="12" stroke-linecap="round"/>`;
  for (let i = 0; i <= 8; i++) { const x = lerp(x0, x1, i / 8), on = p >= i / 8 - 0.001; g += `<circle cx="${x}" cy="${y}" r="${i % 4 ? 14 : 20}" fill="${on ? C.teal : "#C3D0D3"}"/>${i % 4 === 0 ? T(x, y + 60, (i * 15) + " min", { size: 24, anchor: "middle", fill: C.muted }) : ""}`; }

add(9, { step: 8, title: ["Flush the", "line"], bullets: ["Use a 10 ml syringe:\nlower pressure", "Pulsatile push–pause", "Clamp with positive pressure", "Flush every lumen regularly"], draw: lt => {

  const sx = 10 + 380 * (1 - Math.min(1, push));
  let g = `<g transform="translate(140 300)"><path d="M -60 44 L 0 38 L 0 72 L -60 66 Z" fill="#F2F6F7" stroke="#8FA3AA" stroke-width="3"/><rect x="0" y="0" width="420" height="110" rx="14" fill="#F4F9FB" stroke="#8FA3AA" stroke-width="4"/><rect x="6" y="8" width="${Math.max(0, sx - 6)}" height="94" rx="8" fill="#BFE3F2"/>${[...Array(11)].map((_, i) => `<line x1="${10 + i * 38}" y1="2" x2="${10 + i * 38}" y2="${i % 5 ? 18 : 32}" stroke="#4A5A60" stroke-width="2.5"/>`).join("")}<rect x="${sx}" y="4" width="20" height="102" rx="6" fill="#3A3F44"/><rect x="${sx + 20}" y="44" width="400" height="22" fill="#fff" stroke="#9AA9AE" stroke-width="2.5"/><rect x="${sx + 414}" y="8" width="20" height="94" rx="6" fill="#fff" stroke="#9AA9AE" stroke-width="2.5"/><rect x="410" y="-26" width="18" height="162" rx="6" fill="#fff" stroke="#9AA9AE" stroke-width="2.5"/>${T(230, -24, "10 ml syringe · NS", { size: 30, w: 800, anchor: "middle", fill: C.teal })}</g>`;
  for (let i = 0; i < 6; i++) { const on = pp * 6 > i; g += `<rect x="${140 + i * 80}" y="520" width="${50}" height="${on ? 70 : 20}" rx="8" fill="${on ? C.teal : "#C3D0D3"}"/>`; }
  g += T(380, 650, "push · pause · push · pause", { size: 30, w: 700, anchor: "middle", fill: C.muted });
  g += callout(850, 560, "Clamp with positive pressure", seg(lt, 5.4, 5.9), C.teal) + callout(850, 650, "Flush every lumen", seg(lt, 6.4, 6.9), C.teal);
  return g;
} });
add(10, { step: 9, crit: true, title: ["Blood sample:", "prepare"], bullets: ["Hand hygiene, gloves,\naseptic technique, sterile field", "Stop IV fluids 1 minute\n(confirm with the physician)", "Clamp the lumen\n(brown port preferred)", "Clean 30 s with CHG 2% +\nIPA 70%; dry 30–60 s"], draw: lt => seqCards([["Prepare", "Hand hygiene\ngloves\nsterile field"], ["Stop fluids", "1 minute\nconfirm with\ndoctor"], ["Clamp", "Brown port\npreferred"], ["Remove cap", ""], ["Clean port", "30 s scrub\ndry 30–60 s"]], lt, 0.5, 0.9, 280) });

add(9, { step: 11, crit: true, title: ["Heparin lock", "for Vascath"], bullets: ["Saline flush first", "Then heparin, as per\nthe manufacturer", "Prevents clots when\nnot in use", "Keeps the lumen patent"], draw: lt => seqCards([["Saline flush", "Clear the lumen"], ["Heparin lock", "As per\nmanufacturer"], ["Patent lumen", "No clot while\nnot in use"]], lt, 0.5, 1.2, 280, 1) + callout(560, 700, "Always saline first, then heparin", seg(lt, 4.4, 4.9), C.red) });
add(11, { step: 12, title: ["Remove the", "line safely"], bullets: ["Position the patient and\ntime with breathing", "Hand hygiene, equipment;\nremove dressing and sutures", "Steady, constant pull", "Press 5–10 min; dressing;\ncheck the catheter is intact"], draw: lt => {
  const out = seg(lt, 2.6, 5.4);
  let g = chestSite({ out });
  g += callout(780, 120, "Air embolism risk: follow positioning and breathing", seg(lt, 0.6, 1.2) * (1 - seg(lt, 2.4, 2.7)), C.red);
  g += callout(780, 120, "Steady, constant pull", seg(lt, 2.8, 3.2) * (1 - seg(lt, 5.4, 5.7)), C.teal);
  const pr = seg(lt, 5.8, 6.4);
  g += `<g opacity="${pr}"><circle cx="500" cy="380" r="60" fill="#fff" stroke="${C.teal}" stroke-width="6"/>${T(500, 392, "5–10", { size: 30, w: 800, anchor: "middle", fill: C.teal })}</g>` + callout(500, 500, "Direct pressure 5–10 min", pr, C.teal);

add(9, { step: 14, title: ["Document and", "report"], bullets: ["Indication and insertion", "Dressing, flush and\ncap changes", "Site signs; report\ncomplications promptly", "Educate; hand over"], draw: lt => {
  const rows = [["Indication", "CVP monitoring · drugs"], ["Inserted", "30/10 · R IJ · 3 lumen"], ["X-ray", "Position confirmed"], ["Dressing", "Transparent · 30/10"], ["Flush / caps", "All lumens flushed 10:00"], ["Site", "No redness or swelling"], ["Handover", "Line status given"]];
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, "Central line record", { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="490" y1="${y + 42}" x2="940" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(490, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;
} });
add(5, { kind: "end" });

function stopwatch2(x, y, p) {
  const a = p * 2 * Math.PI;
  return `<g transform="translate(${x} ${y})"><circle r="70" fill="#fff" stroke="${C.ink}" stroke-width="6"/><path d="M 0 0 L 0 -60 A 60 60 0 ${a > Math.PI ? 1 : 0} 1 ${60 * Math.sin(a)} ${-60 * Math.cos(a)} Z" fill="${C.tealSoft}"/><circle r="6" fill="${C.ink}"/></g>`;
}

const DURS = [6.96, 14.41, 15.96, 18.29, 13.89, 13.7, 20.04, 8, 13.02, 23.47, 15.37, 15.24, 21.32, 10.4, 15.09, 5]; SCENES.forEach((s, i) => s.dur = DURS[i]);
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt) {
  const p = seg(lt, 0, 0.5);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 40} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) g += `<rect x="1362" y="174" width="300" height="52" rx="26" fill="${C.red}"/>${T(1512, 210, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}`;
  g += `</g>`;
  s.bullets.forEach((b, i) => {
    const q = seg(lt, 0.6 + i * 0.5, 1.0 + i * 0.5);
    g += `<g opacity="${q}"><rect x="1250" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    b.split("\n").forEach(l => { g += T(1284, y, l, { size: 34, w: 500 }); y += 46; });
    g += `</g>`; y += 22;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "CENTRAL LINE", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(300, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "Central", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "line care", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Assisting insertion, maintenance and removal \u00b7 step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 540) rotate(-35)"><circle r="190" fill="#fff" opacity=".12" transform="rotate(35)"/><rect x="-160" y="-14" width="170" height="28" rx="12" fill="#fff"/><rect x="-40" y="-36" width="70" height="72" rx="12" fill="#E5ECEF"/><line x1="30" y1="-6" x2="190" y2="-60" stroke="#C08A55" stroke-width="16" stroke-linecap="round"/><line x1="30" y1="0" x2="200" y2="0" stroke="#6C97E8" stroke-width="16" stroke-linecap="round"/><line x1="30" y1="6" x2="190" y2="60" stroke="#fff" stroke-width="16" stroke-linecap="round"/></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review \u00b7 Module 04 \u00b7 RMS.NCC.MW.F.001 \u00b7 follow hospital policy", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow hospital policy and the central line bundle.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0;
  for (const sc of SCENES) { if (t < acc + sc.dur) { s = sc; lt = t - acc; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = `<rect width="1920" height="1080" fill="${C.bg}"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    g += chrome(s);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(60 130)"><rect width="1120" height="840" rx="28" fill="#fff" stroke="${C.line}" stroke-width="2"/><g clip-path="url(#card)">${s.draw(lt)}</g></g>`;
    g += textPanel(s, lt);
  }
  // fade from previous scene
  const fin = clamp(lt / 0.35), fout = clamp((s.dur - lt) / 0.35);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="${C.bg}" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
