<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0, col = C.glove, edge = C.gloveEdge) {
  // gloved hand seen from above: palm, four fingers and thumb, sized by rx
  const s = rx / 60;
  const f = [[-27, -64, 15, 46], [-9, -76, 15, 58], [9, -72, 15, 54], [27, -58, 14, 42]].map(([fx, fy, w, h]) => `<rect x="${fx - w / 2}" y="${fy}" width="${w}" height="${h}" rx="${w / 2}" fill="${col}" stroke="${edge}" stroke-width="2.5"/>`).join("");
  return `<g transform="translate(${x} ${y}) rotate(${rot + 90}) scale(${s})">${f}<rect x="-62" y="-14" width="44" height="17" rx="8.5" transform="rotate(-35 -40 -6)" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -38 -26 C -38 -40, 38 -40, 38 -26 L 36 34 C 30 48, -30 48, -36 34 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -30 48 L 30 48 L 32 70 L -32 70 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/></g>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}

function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    const y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${col === C.red ? C.redSoft : C.bg}"/>${T(150, sub ? 62 : h / 2 + 13, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${col === C.red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk)}</g>`;
  }).join("");
}

// ---------- PEG tube scenes (Module 04, RMS.NCC.MW.F.009) ----------
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));
const SKIN_Y = 380;

// side cross-section: skin, abdominal wall, stomach, internal + external bumper
function pegAnat(o = {}) {
  const lift = (o.lift || 0) * 34, lab = o.labels ?? 1;
  let g = `<rect x="0" y="${SKIN_Y}" width="1120" height="26" fill="${C.skin}" stroke="${C.skinEdge}" stroke-width="3"/><rect x="0" y="${SKIN_Y + 26}" width="1120" height="70" fill="#F4DCC8"/><rect x="0" y="${SKIN_Y + 96}" width="1120" height="34" fill="#E3A99E"/>`;
  g += `<path d="M 0 ${SKIN_Y + 130} H 1120 V 840 H 0 Z" fill="#F6D3CC"/><path d="M 0 ${SKIN_Y + 130} H 1120" stroke="#D98C82" stroke-width="4"/>`;
  if (o.drain) g += `<ellipse cx="560" cy="${SKIN_Y + 4}" rx="${50 * o.drain}" ry="${10 * o.drain}" fill="#E9D27A" opacity=".8"/>`;
  // clear PEG tube with cm marks and a blue line, purple Y-port feeding adapter on top
  g += `<rect x="544" y="${SKIN_Y - 300}" width="32" height="${300 + 170}" fill="#F4F8F9" stroke="#93A7AE" stroke-width="3"/><line x1="556" y1="${SKIN_Y - 300}" x2="556" y2="${SKIN_Y + 170}" stroke="#2F6FD6" stroke-width="2.5"/>${[...Array(7)].map((_, i) => `<line x1="546" y1="${SKIN_Y - 270 + i * 36}" x2="${i % 2 ? 556 : 566}" y2="${SKIN_Y - 270 + i * 36}" stroke="#2A2F33" stroke-width="3"/>`).join("")}`;
  g += `<path d="M 540 ${SKIN_Y - 300} L 536 ${SKIN_Y - 330} L 584 ${SKIN_Y - 330} L 580 ${SKIN_Y - 300} Z" fill="#C7A9E3" stroke="#7B4FA0" stroke-width="2.5"/><rect x="528" y="${SKIN_Y - 352}" width="30" height="24" rx="5" fill="#7B4FA0"/><path d="M 572 ${SKIN_Y - 326} L 600 ${SKIN_Y - 350}" stroke="#C7A9E3" stroke-width="16" stroke-linecap="round"/><rect x="592" y="${SKIN_Y - 366}" width="22" height="20" rx="5" fill="#7B4FA0" transform="rotate(-40 603 ${SKIN_Y - 356})"/>`;
  // internal bumper: soft mushroom dome
  g += `<path d="M 470 ${SKIN_Y + 178} C 470 ${SKIN_Y + 150}, 520 ${SKIN_Y + 132}, 560 ${SKIN_Y + 132} C 600 ${SKIN_Y + 132}, 650 ${SKIN_Y + 150}, 650 ${SKIN_Y + 178} C 620 ${SKIN_Y + 168}, 500 ${SKIN_Y + 168}, 470 ${SKIN_Y + 178} Z" fill="#E9EEF0" stroke="#93A7AE" stroke-width="3"/>`;
  g += `<g transform="rotate(${o.rot || 0} 560 ${SKIN_Y - 12 - lift})"><path d="M 470 ${SKIN_Y - lift} C 470 ${SKIN_Y - 14 - lift}, 520 ${SKIN_Y - 30 - lift}, 560 ${SKIN_Y - 30 - lift} C 600 ${SKIN_Y - 30 - lift}, 650 ${SKIN_Y - 14 - lift}, 650 ${SKIN_Y - lift} Z" fill="#7FB8E0" stroke="#3B7FB0" stroke-width="3"/><rect x="536" y="${SKIN_Y - 44 - lift}" width="48" height="18" rx="5" fill="#3B7FB0"/></g>`; // external bolster
  if (lab) g += `<g opacity="${lab}">${T(40, SKIN_Y - 16, "Skin", { size: 24, fill: C.muted })}${T(40, SKIN_Y + 72, "Abdominal wall", { size: 24, fill: C.muted })}${T(40, SKIN_Y + 200, "Stomach", { size: 26, w: 700, fill: "#B0554A" })}${T(680, SKIN_Y - 6, "External bumper", { size: 24, w: 700, fill: "#4F7682" })}${T(680, SKIN_Y + 172, "Internal bumper", { size: 24, w: 700, fill: "#8A7F60" })}${T(600, SKIN_Y - 290, "PEG tube", { size: 24, w: 700, fill: "#8A7F60" })}</g>`;
  return g;
}
function bigSyringe(x, y, level, label) { // 60 ml purple enteral syringe barrel, plunger removed, used for gravity flow
  let g = `<g transform="translate(${x} ${y})"><rect x="-10" y="-6" width="110" height="14" rx="5" fill="#C7A9E3" stroke="#7B4FA0" stroke-width="2"/><rect x="0" y="0" width="90" height="220" rx="10" fill="#F4F9FB" stroke="#8FA3AA" stroke-width="3"/><rect x="5" y="${5 + 210 * (1 - level)}" width="80" height="${210 * level}" rx="6" fill="#9FD3EA"/>`;
  for (let i = 0; i <= 6; i++) g += `<line x1="0" y1="${210 - i * 33}" x2="${i % 2 ? 14 : 24}" y2="${210 - i * 33}" stroke="#4A5A60" stroke-width="2"/>`;
  return g + `<path d="M 28 220 L 62 220 L 54 250 L 36 250 Z" fill="#C7A9E3" stroke="#7B4FA0" stroke-width="2.5"/>${T(45, -22, label, { size: 26, w: 800, anchor: "middle", fill: C.teal })}</g>`;
}

add(4.5, { kind: "title" });
add(8, { step: 1, title: ["Know the", "PEG tube"], bullets: ["Indications and purpose:\nlong-term enteral feeding", "Know the contraindications", "Understand insertion\nand management"], draw: lt => {
  let g = pegAnat({ labels: seg(lt, 1.0, 1.8) });
  g += `<path d="M 560 ${SKIN_Y - 330} q 0 -40 60 -50" fill="none" stroke="#F7F3EA" stroke-width="30" opacity="0"/>`;
  return g + callout(800, 200, "Percutaneous endoscopic gastrostomy", seg(lt, 2.4, 3.0), C.teal);
} });
add(8, { step: 2, title: ["Assemble the", "equipment"], bullets: ["Confirm the physician's order", "Dressing set, sterile\nnormal saline", "Non-sterile and sterile gloves", "Sterile gauze dressing,\nface masks"], draw: lt => checkCards([["Physician's order confirmed", ""], ["Dressing set", ""], ["Sterile normal saline vial", ""], ["Non-sterile + sterile gloves", ""], ["Sterile gauze dressing", "e.g. Primapore or Opsite"], ["Face masks", ""]], lt, 80, 960, 104, 122, 50) });
add(8, { step: 3, title: ["Prepare", "the patient"], bullets: ["New PEG = first week\nafter insertion", "Explain; head slightly elevated", "Curtains drawn,\nvisitors asked to leave", "Confirm patient identity"], draw: lt => checkCards([["Newly inserted PEG", "Within the first week of insertion"], ["Explain and position", "Head slightly elevated"], ["Privacy", "Curtains drawn, visitors leave"], ["Identity confirmed", "Right patient"]], lt) });
add(9, { step: 4, title: ["Remove the", "old dressing"], bullets: ["Change at least daily", "Wash hands; non-sterile\ngloves and mask", "Prevent aspiration", "Check for infection\nand skin integrity"], draw: lt => {
  const off = seg(lt, 1.0, 2.6);
  let g = pegAnat({ labels: 0 });
  g += `<g opacity="${1 - off}" transform="translate(${off * 300} ${-off * 120}) rotate(${off * 20} 560 ${SKIN_Y - 30})">${[430, 590].map(x => `<rect x="${x}" y="${SKIN_Y - 46}" width="100" height="46" rx="6" fill="#fff" stroke="#B8C4C9" stroke-width="3"/>${[1, 2, 3, 4].map(k => `<line x1="${x + k * 20}" y1="${SKIN_Y - 44}" x2="${x + k * 20}" y2="${SKIN_Y - 2}" stroke="#E2E8EA" stroke-width="2"/>`).join("")}<line x1="${x + 2}" y1="${SKIN_Y - 23}" x2="${x + 98}" y2="${SKIN_Y - 23}" stroke="#E2E8EA" stroke-width="2"/><path d="M ${x + 30} ${SKIN_Y - 6} q 20 -10 40 0" fill="none" stroke="#E2CF8C" stroke-width="5" opacity=".8"/>`).join("")}</g>`;
  const ins = seg(lt, 3.0, 3.6);
  g += `<g opacity="${ins}"><circle cx="560" cy="${SKIN_Y}" r="${120 + 6 * Math.sin(lt * 4)}" fill="none" stroke="${C.teal}" stroke-width="5" stroke-dasharray="12 10"/></g>`;
  g += callout(820, 150, "Redness? Swelling? Pus? Pain?", seg(lt, 3.4, 3.9), C.red);
  return g;
} });
add(10, { step: 5, crit: true, title: ["Clean the stoma", "aseptically"], bullets: ["Sterile field, sterile gloves", "Slide outer bumper ~1 cm\nfrom the skin", "Inspect drainage and tube", "0.9% sodium chloride, circular\noutward motion; rinse well"], draw: lt => {
  const lift = seg(lt, 0.8, 2.0), dr = seg(lt, 2.4, 3.2) * (1 - seg(lt, 5.0, 6.0));
  let g = pegAnat({ lift, labels: 0, drain: dr });
  g += callout(830, 230, "Slide bumper ~1 cm", seg(lt, 1.0, 1.4) * (1 - seg(lt, 2.4, 2.7)), C.teal);
  g += callout(830, 230, "Press gently: any drainage?", seg(lt, 2.6, 3.0) * (1 - seg(lt, 4.0, 4.3)), C.teal);
  // top-view inset: circular outward cleaning
  const sp = seg(lt, 4.2, 7.4), ip = seg(lt, 4.0, 4.4);
  let path = ""; const n = 120;
  for (let i = 0; i <= n * sp; i++) { const a = i / n * Math.PI * 6, r = 22 + i / n * 90; path += (i ? "L" : "M") + (160 + r * Math.cos(a)).toFixed(1) + " " + (150 + r * Math.sin(a)).toFixed(1) + " "; }
  g += `<g opacity="${ip}" transform="translate(760 470)"><rect width="320" height="320" rx="24" fill="#fff" stroke="${C.line}" stroke-width="3"/><circle cx="160" cy="150" r="120" fill="${C.skin}"/><circle cx="160" cy="150" r="20" fill="#F7F3EA" stroke="#B9AE8E" stroke-width="3"/>${path ? `<path d="${path}" fill="none" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>` : ""}${T(160, 300, "Circular, outward", { size: 24, w: 800, anchor: "middle", fill: C.teal })}</g>`;
  return g + callout(560, 60, "0.9% sodium chloride, aseptic technique", seg(lt, 4.6, 5.0), C.red);
} });
add(8, { step: 6, title: ["Rotate and", "replace the bumper"], bullets: ["Rotate outer bumper 90°", "Slide it back over\nthe exit site", "Not too tight on the skin"], draw: lt => {
  const r = seg(lt, 0.8, 2.6), down = seg(lt, 3.0, 4.4);
  let g = pegAnat({ lift: 1 - down, labels: 0 });
  g += `<g transform="translate(760 120)"><rect width="320" height="300" rx="24" fill="#fff" stroke="${C.line}" stroke-width="3"/><circle cx="160" cy="140" r="110" fill="${C.skin}"/><g transform="rotate(${90 * r} 160 140)"><path d="M 72 140 C 72 112, 120 104, 160 104 C 200 104, 248 112, 248 140 C 248 168, 200 176, 160 176 C 120 176, 72 168, 72 140 Z" fill="#7FB8E0" stroke="#3B7FB0" stroke-width="3"/><rect x="150" y="104" width="20" height="72" fill="#3B7FB0" opacity=".5"/></g><circle cx="160" cy="140" r="18" fill="#F4F8F9" stroke="#93A7AE" stroke-width="3"/><line x1="160" y1="126" x2="160" y2="154" stroke="#2F6FD6" stroke-width="2"/>${T(160, 280, "Top view", { size: 22, anchor: "middle", fill: C.muted })}</g>`;
  g += callout(920, 470, "Rotate 90°", seg(lt, 1.0, 1.4), C.teal) + callout(300, 220, "Slide back over the site", seg(lt, 3.2, 3.6), C.teal);
  return g;
} });
add(9, { step: 7, title: ["Dressing", "rules"], bullets: ["Gauze over the site only if\nleaking or risk of dislodging", "Never under the bumper;\nnever cover the tube", "Date and time on the tape;\nlabel every tube", "Healed (~1 week):\nno dressing needed"], draw: lt => checkCards([["Gauze UNDER the outer bumper", "Never"], ["Dressing covering the tube", "Never"]], lt, 80, 960, 130, 160, 60, C.red) + checkCards([["Gauze over the site if needed", "Leakage, or risk of dislodging"], ["Date + time on the tape", "Other tubes: name and number"], ["Healed site (~1 week)", "No dressing required"]], Math.max(0, lt - 1.4), 80, 960, 130, 160, 380) });
add(9, { step: 8, crit: true, title: ["Before the", "first feed"], bullets: ["24 hours after insertion", "Peristalsis present", "Doctor's order", "Semi-Fowler's position;\nright feed, right volume"], draw: lt => {
  let g = checkCards([["24 hours post insertion", ""], ["Peristalsis present", ""], ["Doctor's order", ""]], lt, 60, 560, 120, 150, 60);
  const b = seg(lt, 2.4, 3.2), ang = lerp(0, 40, seg(lt, 3.0, 4.4));
  g += `<g opacity="${b}" transform="translate(640 140)"><rect x="0" y="330" width="440" height="34" rx="10" fill="#9DB9C3"/><rect x="20" y="364" width="18" height="90" fill="#9DB9C3"/><rect x="400" y="364" width="18" height="90" fill="#9DB9C3"/>`;
  g += `<rect x="200" y="290" width="240" height="40" rx="12" fill="#E3EEF2" stroke="#8DA9B4" stroke-width="3"/><rect x="215" y="252" width="215" height="40" rx="18" fill="#CFE3EA" stroke="#9DB9C3" stroke-width="2"/>`;
  g += `<g transform="rotate(${ang} 200 310)"><rect x="10" y="290" width="190" height="40" rx="12" fill="#E3EEF2" stroke="#8DA9B4" stroke-width="3"/><rect x="60" y="252" width="150" height="40" rx="18" fill="#CFE3EA" stroke="#9DB9C3" stroke-width="2"/><circle cx="30" cy="262" r="32" fill="${C.skin}" stroke="${C.skinEdge}" stroke-width="3"/></g>`;
  g += `<path d="M 200 310 m -70 0 a 70 70 0 0 1 ${70 - 70 * Math.cos(ang * Math.PI / 180)} ${-70 * Math.sin(ang * Math.PI / 180)}" fill="none" stroke="${C.teal}" stroke-width="4" opacity="${seg(lt, 3.4, 4.0)}"/>`;
  g += `${T(220, 520, "Semi-Fowler's", { size: 32, w: 800, anchor: "middle", fill: C.teal })}${T(220, 560, "head up 30–45°", { size: 26, anchor: "middle", fill: C.muted })}</g>`;
  return g + callout(560, 760, "Verify feed type and volume", seg(lt, 5.0, 5.6), C.teal);
} });
add(9, { step: 9, title: ["Check residual", "and patency"], bullets: ["Assess residual gastric\ncontents as per policy", "Patency: let 30 ml water\nflow in by gravity", "Doesn't flow? Don't force;\nescalate"], draw: lt => {
  const lvl = 1 - seg(lt, 2.0, 5.0);
  let g = pegAnat({ labels: 0 });
  g += bigSyringe(515, 50, lvl, "30 ml water");
  g += `<rect x="553" y="${SKIN_Y - 70}" width="14" height="${(1 - lvl) * 230}" fill="#9FD3EA" opacity="${lvl < 1 ? 0.8 : 0}"/>`;
  g += callout(840, 160, "Flows freely = patent", seg(lt, 5.2, 5.8), C.green);
  return g + callout(840, 260, "Gravity, no pushing", seg(lt, 2.2, 2.6) * (1 - seg(lt, 4.8, 5.1)), C.teal);
} });
add(9, { step: 10, title: ["Feeding", "and flushing"], bullets: ["Follow the procedure for\ncontinuous or intermittent feeds", "Flush when required\nby policy", "Clean the syringe after use", "Replace bag and tubing\nat set intervals"], draw: lt => checkCards([["Continuous or intermittent", "Follow the correct procedure"], ["Flush the tube", "At the times set by policy"], ["Feeding syringe", "Clean and store after each use"], ["Bag and tubing", "Replace at the set interval"]], lt) });
add(8, { step: 11, title: ["Watch for", "intolerance"], bullets: ["Nausea, vomiting,\nabdominal distension", "Stop the feed, sit the\npatient up, assess", "Inform the doctor"], draw: lt => checkCards([["Nausea", ""], ["Vomiting", ""], ["Abdominal distension", ""]], lt, 80, 960, 120, 150, 70, C.red) + callout(560, 620, "Stop feed · sit up · assess · inform doctor", seg(lt, 2.6, 3.2), C.teal) });
add(8, { step: 12, title: ["Give medicines", "safely"], bullets: ["Correct administration\nvia the PEG, as per policy", "One medicine at a time", "Flush before, between\nand after"], draw: lt => {
  const st = [["Flush", "before"], ["Med 1", ""], ["Flush", "between"], ["Med 2", ""], ["Flush", "after"]];
  let g = "";
  st.forEach(([h, s], i) => { const x = 40 + i * 212, p = seg(lt, 0.5 + i * 0.7, 1.0 + i * 0.7), fl = h === "Flush";
    g += `<g opacity="${p}" transform="translate(${x} ${300 + (1 - p) * 30})"><rect width="190" height="220" rx="22" fill="${fl ? "#E1F1F8" : C.tealSoft}"/><circle cx="95" cy="70" r="40" fill="${fl ? "#3B8DB5" : C.teal}"/>${T(95, 86, String(i + 1), { size: 40, w: 800, anchor: "middle", fill: "#fff" })}${T(95, 160, h, { size: 30, w: 800, anchor: "middle" })}${s ? T(95, 196, s, { size: 24, anchor: "middle", fill: C.muted }) : ""}</g>`;
    if (i < 4) g += `<g opacity="${p}">${arrow(x + 192, 410, x + 210, 410, C.muted, 4)}</g>`; });
  return g + callout(560, 680, "Check the policy and pharmacist for each drug", seg(lt, 4.4, 5.0), C.teal);
} });
add(7, { step: 13, title: ["Care for the", "person"], bullets: ["Empathy and reassurance", "Dignity and privacy", "Escalate leakage, infection\nor displacement promptly"], draw: lt => checkCards([["Empathy and reassurance", "During care and feeding"], ["Dignity and privacy", "Throughout all procedures"], ["Accountability", "Infection control; escalate complications"]], lt, 80, 960, 160, 220, 140) });
add(8, { step: 14, title: ["Document and", "report"], bullets: ["Tolerance of feeds\nand medicines", "Stoma site: skin, leakage,\nsigns of infection", "Report displacement,\nblockage or complications"], draw: lt => {
  const rows = [["Dressing change", "30/10 · 09:00 · aseptic"], ["Stoma site", "Skin intact · no leakage"], ["Signs of infection", "None"], ["Patency", "30 ml water flowed freely"], ["Feed", "Intermittent · 250 ml"], ["Tolerance", "No nausea or distension"], ["Reported", "Nil abnormal"]];
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, "PEG care record", { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="520" y1="${y + 42}" x2="930" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(520, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;
} });
add(5, { kind: "end" });

const DURS = [6.15, 14.64, 13.3, 15.0, 15.3, 22.58, 8, 20.06, 15.69, 12.06, 13.34, 11.33, 9.48, 10.29, 12.91, 5]; SCENES.forEach((s, i) => s.dur = DURS[i]);
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt) {
  const p = seg(lt, 0, 0.5);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 40} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) g += `<rect x="1362" y="174" width="300" height="52" rx="26" fill="${C.red}"/>${T(1512, 210, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}`;
  g += `</g>`;
  s.bullets.forEach((b, i) => {
    const q = seg(lt, 0.6 + i * 0.5, 1.0 + i * 0.5);
    g += `<g opacity="${q}"><rect x="1250" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    b.split("\n").forEach(l => { g += T(1284, y, l, { size: 34, w: 500 }); y += 46; });
    g += `</g>`; y += 22;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "PEG TUBE", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(215, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "PEG tube", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "care", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Site care, feeding and medicines \u00b7 step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 540)"><circle r="190" fill="#fff" opacity=".12"/><circle r="150" fill="#F3C9A8"/><g transform="rotate(${30 * r})"><rect x="-130" y="-34" width="260" height="68" rx="22" fill="#C9DCE3" stroke="#fff" stroke-width="5"/></g><circle r="34" fill="#fff"/><circle r="16" fill="#BFE6E6"/></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review \u00b7 Module 04 \u00b7 RMS.NCC.MW.F.009 \u00b7 follow hospital policy", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow hospital policy and infection control standards.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0;
  for (const sc of SCENES) { if (t < acc + sc.dur) { s = sc; lt = t - acc; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = `<rect width="1920" height="1080" fill="${C.bg}"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    g += chrome(s);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(60 130)"><rect width="1120" height="840" rx="28" fill="#fff" stroke="${C.line}" stroke-width="2"/><g clip-path="url(#card)">${s.draw(lt)}</g></g>`;
    g += textPanel(s, lt);
  }
  // fade from previous scene
  const fin = clamp(lt / 0.35), fout = clamp((s.dur - lt) / 0.35);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="${C.bg}" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
</body></html>
