<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0, col = C.glove, edge = C.gloveEdge) {
  // gloved hand seen from above: palm, four fingers and thumb, sized by rx
  const s = rx / 60;
  const f = [[-27, -64, 15, 46], [-9, -76, 15, 58], [9, -72, 15, 54], [27, -58, 14, 42]].map(([fx, fy, w, h]) => `<rect x="${fx - w / 2}" y="${fy}" width="${w}" height="${h}" rx="${w / 2}" fill="${col}" stroke="${edge}" stroke-width="2.5"/>`).join("");
  return `<g transform="translate(${x} ${y}) rotate(${rot + 90}) scale(${s})">${f}<rect x="-62" y="-14" width="44" height="17" rx="8.5" transform="rotate(-35 -40 -6)" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -38 -26 C -38 -40, 38 -40, 38 -26 L 36 34 C 30 48, -30 48, -36 34 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -30 48 L 30 48 L 32 70 L -32 70 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/></g>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}

function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    const y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${col === C.red ? C.redSoft : C.bg}"/>${T(150, sub ? 62 : h / 2 + 13, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${col === C.red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk)}</g>`;
  }).join("");
}

// ---------- Lumbar puncture scenes (Module 04, RMS.NCC.MW.F.002) ----------
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));

// lumbar spine, patient lying on the side: back at the top of the card
function spine(o = {}) {
  let g = `<rect x="0" y="0" width="1120" height="840" fill="#FBF3EC"/><rect x="0" y="0" width="1120" height="150" fill="${C.skin}" opacity=".55"/>${T(40, 60, "Skin (back)", { size: 24, fill: C.muted })}`;
  g += `<rect x="0" y="430" width="1120" height="80" fill="#CDE8F5"/>${T(40, 480, "CSF (subarachnoid space)", { size: 24, w: 700, fill: "#2D6A92" })}`;
  ["L2", "L3", "L4", "L5"].forEach((l, i) => { const x = 110 + i * 250;
    g += `<rect x="${x}" y="540" width="190" height="170" rx="26" fill="#EFE6D6" stroke="#C9B998" stroke-width="4"/>${T(x + 95, 640, l, { size: 30, w: 800, anchor: "middle", fill: "#8A7F60" })}`;
    g += `<path d="M ${x + 40} 420 L ${x + 70} 220 L ${x + 120} 220 L ${x + 150} 420 Z" fill="#EFE6D6" stroke="#C9B998" stroke-width="4"/>`; });
  const n = o.needle || 0;
  if (n > 0) { const tipY = lerp(40, 470, n);
    g += spinalNeedle(610, tipY); }
  if (o.drip) for (let i = 0; i < 4; i++) { const k = (o.t * 0.8 + i / 4) % 1; g += `<circle cx="610" cy="${lerp(0, 120, k) - 60 + (n ? lerp(40, 470, n) - 420 : 0)}" r="9" fill="#9FD3EA" opacity="${o.drip * (1 - k)}"/>`; }
  return g;
}

add(4.5, { kind: "title" });
add(8, { step: 1, title: ["Know the", "procedure"], bullets: ["Where to find the LP policy", "Why the LP is done;\nthe nurse's role", "Equipment needed", "Safe holding; contraindications\nand complications"], draw: lt => checkCards([["LP policy", "Know where to find it"], ["Reason and role", "Why the LP is done; what you do"], ["Equipment", "Know the full list"], ["Safety", "Safe holding · contraindications · complications"]], lt) });
add(9, { step: 2, title: ["Prepare the", "patient"], bullets: ["Explain; consent taken", "Organise the equipment", "Privacy", "Hand hygiene and PPE"], draw: lt => checkCards([["Explained to the patient", ""], ["Informed consent taken", ""], ["Equipment organised", ""], ["Privacy provided", ""], ["Hand hygiene", ""], ["Appropriate PPE", ""]], lt, 80, 960, 104, 122, 50) });
add(10, { step: 3, crit: true, title: ["Position and", "hold safely"], bullets: ["Side-lying at the\nedge of the bed", "Knees to chest,\nchin to chest", "Back curved outwards", "Support the patient\nthroughout"], draw: lt => {
  const c = seg(lt, 0.8, 3.0);
  let g = "";
  // seen from above: patient on their side, back towards the bed edge (bottom), curling into a C
  const L = (a, b) => lerp(a, b, c);
  const hip = { x: 420, y: 430 }, sh = { x: L(720, 650), y: L(430, 380) }, ctl = { x: L(570, 560), y: L(430, 560) };
  const knee = { x: L(230, 600), y: L(430, 250) }, foot = { x: L(60, 380), y: L(430, 210) };
  const head = { x: sh.x + L(110, 60), y: sh.y + L(0, -80) };
  g += `<line x1="40" y1="640" x2="1080" y2="640" stroke="${C.ink}" stroke-width="5"/>${T(1060, 680, "Bed edge", { size: 24, fill: C.muted, anchor: "end" })}`;
  g += `<path d="M ${hip.x} ${hip.y} L ${knee.x} ${knee.y} L ${foot.x} ${foot.y}" fill="none" stroke="#8DA9B4" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>`;
  g += `<path d="M ${hip.x} ${hip.y} Q ${ctl.x} ${ctl.y} ${sh.x} ${sh.y}" fill="none" stroke="#CFE3EA" stroke-width="130" stroke-linecap="round"/><path d="M ${hip.x} ${hip.y + 62} Q ${ctl.x} ${ctl.y + 62} ${sh.x} ${sh.y + 62}" fill="none" stroke="#9DB9C3" stroke-width="4" opacity="${c}"/>`;
  g += `<circle cx="${head.x}" cy="${head.y}" r="62" fill="${C.skin}" stroke="${C.skinEdge}" stroke-width="3"/>`;
  g += `<g opacity="${seg(lt, 3.2, 3.8)}"><path d="M 400 560 Q 560 690 700 520" fill="none" stroke="${C.teal}" stroke-width="6" stroke-dasharray="12 8"/>${T(560, 720, "Back curved towards the doctor", { size: 26, w: 800, fill: C.teal, anchor: "middle" })}</g>`;
  g += callout(860, 90, "Knees to chest · chin to chest", seg(lt, 3.6, 4.2), C.teal);
  g += callout(560, 790, "Nurse supports behind the neck and knees", seg(lt, 4.8, 5.4), C.red) + `<g opacity="${seg(lt, 4.8, 5.4)}">${glove(760, 330, 50, 32, 30)}${glove(560, 200, 50, 32, -20)}</g>`;
  return g;
} });
add(8, { step: 4, crit: true, title: ["Assist with", "aseptic technique"], bullets: ["Follow aseptic technique\nthroughout", "Assist the doctor\nas required", "Keep the sterile field intact"], draw: lt => checkCards([["Aseptic technique", "Every step, every time"], ["Sterile field intact", "No reaching across, no touching"], ["Assist the doctor", "Hand over items as required"], ["Watch the patient", "Comfort, distress, colour"]], lt) });
add(9, { step: 5, title: ["Needle into", "the CSF space"], bullets: ["The doctor inserts the\nneedle and stylet", "Into the subarachnoid space", "A free drip of CSF\nconfirms position"], draw: lt => {
  const n = seg(lt, 0.8, 3.6);
  return spine({ needle: n, drip: seg(lt, 4.0, 4.6), t: lt }) + callout(860, 120, "Between the spinous processes", seg(lt, 1.2, 1.6) * (1 - seg(lt, 3.8, 4.1)), C.teal) + callout(860, 120, "Free drip of CSF", seg(lt, 4.2, 4.6), C.teal);
} });
add(8, { step: 6, title: ["Measure the", "pressure"], bullets: ["Spinal manometer attached\nby a three-way stopcock", "Read the CSF pressure", "Then turn the stopcock\nto collect"], draw: lt => {
  const h = seg(lt, 1.2, 4.6);
  let g = `<rect x="508" y="80" width="44" height="620" rx="10" fill="#F1F7FA" fill-opacity=".9" stroke="#8FA9B3" stroke-width="3"/><rect x="514" y="${692 - 420 * h}" width="32" height="${420 * h}" rx="6" fill="#CBE7F4"/><line x1="518" y1="90" x2="518" y2="690" stroke="#fff" stroke-width="5" opacity=".8"/><rect x="500" y="384" width="60" height="16" rx="5" fill="#DDE5E8" stroke="#8FA9B3" stroke-width="2"/>`;
  for (let i = 0; i <= 30; i++) { const y = 692 - i * 19.3; g += `<line x1="552" y1="${y}" x2="${i % 5 ? 566 : 578}" y2="${y}" stroke="#4A5A60" stroke-width="2"/>` + (i % 5 === 0 ? T(588, y + 8, String(i), { size: 20, fill: "#4A5A60" }) : ""); }
  g += T(530, 64, "cm H₂O", { size: 22, w: 700, anchor: "middle", fill: C.muted });
  g += `<g opacity="${seg(lt, 1.0, 1.4)}"><path d="M 530 700 L 530 724" stroke="#8FA9B3" stroke-width="10"/></g>`;
  g += stopcock(530, 750, 90) + T(640, 758, "Three-way stopcock", { size: 26, w: 700, fill: C.teal });
  g += `<path d="M 530 776 L 530 840" stroke="#B9C7CC" stroke-width="12"/><path d="M 530 776 L 530 840" stroke="#EEF5F7" stroke-width="6"/>${T(400, 820, "to needle hub", { size: 20, fill: C.muted, anchor: "end" })}`;
  return g + callout(800, 300, "Read the pressure", seg(lt, 4.8, 5.3), C.teal);
} });
add(9, { step: 7, title: ["Collect the", "CSF samples"], bullets: ["Three to five sterile\nspecimen tubes", "Number them in order", "Note colour and turbidity"], draw: lt => {
  let g = "";
  for (let i = 0; i < 5; i++) { const x = 140 + i * 180, f = seg(lt, 0.6 + i * 0.8, 1.3 + i * 0.8), cap = i < 3 ? "#E24B45" : "#B8C3C7";
    g += `<g transform="translate(${x} 200)" opacity="${i < 3 ? 1 : 0.75}"><path d="M 10 10 L 80 10 L 80 250 L 45 300 L 10 250 Z" fill="#F4F9FB" fill-opacity=".9" stroke="#8FA9B3" stroke-width="3"/><path d="M 13 ${250 - 200 * f + 40} L 77 ${250 - 200 * f + 40} L 77 250 L 45 296 L 13 250 Z" fill="#E8F5FA" stroke="#BFDDEA" stroke-width="2" opacity="${f > 0 ? 1 : 0}"/><line x1="22" y1="30" x2="22" y2="240" stroke="#fff" stroke-width="5" opacity=".8"/><rect x="4" y="-34" width="82" height="48" rx="6" fill="${cap}"/>${[0, 1, 2, 3, 4, 5, 6].map(k => `<line x1="${14 + k * 10.5}" y1="-30" x2="${14 + k * 10.5}" y2="10" stroke="#00000022" stroke-width="3"/>`).join("")}<rect x="16" y="80" width="58" height="70" rx="5" fill="#fff" stroke="#C3CDD1" stroke-width="2"/>${T(45, 128, String(i + 1), { size: 34, w: 800, anchor: "middle", fill: C.ink })}</g>`; }
  g += T(560, 580, "Tubes 4 and 5 if required", { size: 26, anchor: "middle", fill: C.muted });
  return g + callout(560, 680, "Note colour and turbidity", seg(lt, 4.8, 5.4), C.teal);
} });
add(9, { step: 8, title: ["After the", "needle is out"], bullets: ["Gauze with tincture iodine", "Direct pressure 30 seconds", "Adhesive dressing", "Dispose, remove gloves,\nwash hands"], draw: lt => {
  let g = `<rect x="0" y="0" width="1120" height="840" fill="${C.skinT}"/><path d="M 560 0 V 840" stroke="${C.skinEdge}" stroke-width="4" opacity=".35"/>`;
  g += `<circle cx="560" cy="420" r="8" fill="#B0554A"/>`;
  const gz = seg(lt, 0.6, 1.4), pr = seg(lt, 1.8, 2.4) * (1 - seg(lt, 5.0, 5.4)), dr = seg(lt, 5.4, 6.2);
  g += `<g opacity="${gz * (1 - dr)}"><rect x="500" y="360" width="120" height="120" rx="6" fill="#fff" stroke="#B8C4C9" stroke-width="3"/>${[1,2,3,4,5,6,7].map(k => `<line x1="${500 + k * 15}" y1="362" x2="${500 + k * 15}" y2="478" stroke="#DCE3E6" stroke-width="2"/><line x1="502" y1="${360 + k * 15}" x2="618" y2="${360 + k * 15}" stroke="#DCE3E6" stroke-width="2"/>`).join("")}<circle cx="560" cy="420" r="30" fill="#9A5A1E" opacity=".6"/></g>`;
  g += `<g opacity="${pr}">${glove(600, 400, 110, 64, -20)}</g>${stopwatch2b(880, 260, seg(lt, 2.2, 5.0), pr)}`;
  g += `<g opacity="${dr}"><rect x="470" y="370" width="180" height="100" rx="20" fill="#F1DCC4" stroke="#CDAE8C" stroke-width="3"/>${[0,1,2,3,4,5,6,7].map(k => `<circle cx="${488 + k * 21}" cy="384" r="2.5" fill="#D9BE9E"/><circle cx="${488 + k * 21}" cy="456" r="2.5" fill="#D9BE9E"/>`).join("")}<rect x="525" y="392" width="70" height="56" rx="6" fill="#FAFAF7" stroke="#E2DDD2" stroke-width="2"/></g>`;
  return g + callout(880, 420, "Press 30 seconds", pr, C.teal) + callout(560, 600, "Adhesive dressing", dr, C.teal);
} });
add(10, { step: 9, crit: true, title: ["Observe after", "the procedure"], bullets: ["Level of consciousness;\npupil size and reaction", "Breathing and vital signs", "Numbness, tingling or pain\ndown the legs", "Site: swelling, bruising,\nCSF leak"], draw: lt => checkCards([["Consciousness and pupils", "Level of consciousness, size, reaction"], ["Breathing and vital signs", ""], ["Legs", "Numbness, tingling, radiating pain"], ["Puncture site", "Oedema, bruising, CSF oozing"]], lt, 80, 960, 140, 170, 110, C.teal) + callout(560, 800, "Report any change promptly", seg(lt, 3.6, 4.2), C.red) });
add(8, { step: 10, title: ["Care for the", "person"], bullets: ["Calm and reassuring", "Privacy: drape, minimal\nexposure", "Communicate with the team;\nreport distress", "Strict asepsis; ethical care"], draw: lt => checkCards([["Calm and reassuring", "Before, during and after"], ["Privacy and dignity", "Appropriate draping"], ["Clear communication", "With the physician and team"], ["Advocate for safety", "Report distress or complications"]], lt) });
add(9, { step: 11, title: ["Document and", "report"], bullets: ["CSF appearance, specimens,\npressure readings", "Condition, vital signs,\nneuro status, intake/output", "Site: CSF leak or bleeding", "Adverse reaction:\nrecord and raise an OVA"], draw: lt => {
  const rows = [["CSF appearance", "Clear, colourless"], ["Specimens", "3 tubes sent to lab"], ["Opening pressure", "15 cm H₂O"], ["Vital signs / neuro", "Stable · GCS 15"], ["Intake / output", "Recorded"], ["Puncture site", "Dry, no CSF leak"], ["Adverse reaction", "None (OVA if any)"]];
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, "LP record", { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="490" y1="${y + 42}" x2="940" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(490, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;
} });
add(5, { kind: "end" });


function spinalNeedle(x, tipY) {
  // spinal needle (20G, yellow): thin steel shaft with bevel, clear hub, stylet cap
  return `<path d="M ${x - 4} ${tipY - 380} L ${x + 4} ${tipY - 380} L ${x + 4} ${tipY - 10} L ${x - 4} ${tipY} Z" fill="#C3CBD0" stroke="#7E8B91" stroke-width="2"/><line x1="${x - 1}" y1="${tipY - 378}" x2="${x - 1}" y2="${tipY - 14}" stroke="#fff" stroke-width="2" opacity=".8"/><path d="M ${x - 18} ${tipY - 380} L ${x + 18} ${tipY - 380} L ${x + 26} ${tipY - 440} L ${x - 26} ${tipY - 440} Z" fill="#EEF5F7" fill-opacity=".9" stroke="#8FA9B3" stroke-width="3"/><rect x="${x - 26}" y="${tipY - 476}" width="52" height="36" rx="6" fill="#F2C200" stroke="#9A7A00" stroke-width="3"/><rect x="${x - 10}" y="${tipY - 492}" width="20" height="18" rx="4" fill="#F2C200" stroke="#9A7A00" stroke-width="3"/>`;
}
function stopcock(x, y, rot = 0) {
  // three-way tap: white body, three Luer ports, blue "off" lever
  return `<g transform="translate(${x} ${y})"><rect x="-56" y="-14" width="112" height="28" rx="8" fill="#F6F8F8" stroke="#8E9BA0" stroke-width="3"/><rect x="-14" y="-40" width="28" height="30" rx="5" fill="#F6F8F8" stroke="#8E9BA0" stroke-width="3"/><circle r="24" fill="#fff" stroke="#8E9BA0" stroke-width="3"/><g transform="rotate(${rot})"><path d="M -10 0 L 10 0 L 6 44 L -6 44 Z" fill="#3E7CC4" stroke="#2B5F9E" stroke-width="2"/><rect x="-30" y="-6" width="60" height="12" rx="6" fill="#3E7CC4"/><circle r="9" fill="#2B5F9E"/></g></g>`;
}
function stopwatch2b(x, y, p, op) {
  const a = p * 2 * Math.PI;
  return `<g opacity="${op}" transform="translate(${x} ${y})"><circle r="70" fill="#fff" stroke="${C.ink}" stroke-width="6"/><path d="M 0 0 L 0 -60 A 60 60 0 ${a > Math.PI ? 1 : 0} 1 ${60 * Math.sin(a)} ${-60 * Math.cos(a)} Z" fill="${C.tealSoft}"/><circle r="6" fill="${C.ink}"/></g>`;
}

const DURS = [4.89, 13.79, 13.66, 16.22, 11.78, 12.68, 8.03, 10.59, 15.45, 19.36, 11.48, 19.42, 5]; SCENES.forEach((s, i) => s.dur = DURS[i]);
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt) {
  const p = seg(lt, 0, 0.5);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 40} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) g += `<rect x="1362" y="174" width="300" height="52" rx="26" fill="${C.red}"/>${T(1512, 210, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}`;
  g += `</g>`;
  s.bullets.forEach((b, i) => {
    const q = seg(lt, 0.6 + i * 0.5, 1.0 + i * 0.5);
    g += `<g opacity="${q}"><rect x="1250" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    b.split("\n").forEach(l => { g += T(1284, y, l, { size: 34, w: 500 }); y += 46; });
    g += `</g>`; y += 22;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "LUMBAR PUNCTURE", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(350, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "Lumbar", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "puncture", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Assisting the doctor \u00b7 step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 540)"><circle r="190" fill="#fff" opacity=".12"/>${[-1, 0, 1].map(i => `<rect x="${i * 110 - 45}" y="20" width="90" height="80" rx="16" fill="#fff" opacity=".9"/><path d="M ${i * 110 - 20} 0 L ${i * 110 - 8} -90 L ${i * 110 + 8} -90 L ${i * 110 + 20} 0 Z" fill="#fff" opacity=".9"/>`).join("")}<line x1="55" y1="-170" x2="55" y2="10" stroke="#F2C200" stroke-width="10" stroke-linecap="round"/></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review \u00b7 Module 04 \u00b7 RMS.NCC.MW.F.002 \u00b7 follow the LP policy", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow the LP policy and aseptic technique.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0;
  for (const sc of SCENES) { if (t < acc + sc.dur) { s = sc; lt = t - acc; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = `<rect width="1920" height="1080" fill="${C.bg}"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    g += chrome(s);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(60 130)"><rect width="1120" height="840" rx="28" fill="#fff" stroke="${C.line}" stroke-width="2"/><g clip-path="url(#card)">${s.draw(lt)}</g></g>`;
    g += textPanel(s, lt);
  }
  // fade from previous scene
  const fin = clamp(lt / 0.35), fout = clamp((s.dur - lt) / 0.35);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="${C.bg}" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
