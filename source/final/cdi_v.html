<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0, col = C.glove, edge = C.gloveEdge) {
  // gloved hand seen from above: palm, four fingers and thumb, sized by rx
  const s = rx / 60;
  const f = [[-27, -64, 15, 46], [-9, -76, 15, 58], [9, -72, 15, 54], [27, -58, 14, 42]].map(([fx, fy, w, h]) => `<rect x="${fx - w / 2}" y="${fy}" width="${w}" height="${h}" rx="${w / 2}" fill="${col}" stroke="${edge}" stroke-width="2.5"/>`).join("");
  return `<g transform="translate(${x} ${y}) rotate(${rot + 90}) scale(${s})">${f}<rect x="-62" y="-14" width="44" height="17" rx="8.5" transform="rotate(-35 -40 -6)" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -38 -26 C -38 -40, 38 -40, 38 -26 L 36 34 C 30 48, -30 48, -36 34 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -30 48 L 30 48 L 32 70 L -32 70 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/></g>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}

function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    const y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${col === C.red ? C.redSoft : C.bg}"/>${T(150, sub ? 62 : h / 2 + 13, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${col === C.red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk)}</g>`;
  }).join("");
}

// ---------- shared chest drain drawings ----------
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));

// chest drainage unit (dry suction, water seal): white case with handle, suction dial,
// orange suction indicator, blue water-seal / air-leak window, three graduated collection columns, blue floor stand
function drainUnit(x, y, o = {}) {
  const col = o.collect ?? 0.3, seal = o.seal ?? 1, suc = o.suction ?? 0, bub = o.bubble || 0, t = o.t || 0, lab = o.labels ?? 1;
  const cl = (v) => Math.max(0, Math.min(1, v));
  let g = `<g transform="translate(${x} ${y})">`;
  // handle and patient port with corrugated tubing stub
  g += `<path d="M 110 4 L 110 -44 C 110 -60, 320 -60, 320 -44 L 320 4" fill="none" stroke="#B9C3C8" stroke-width="20" stroke-linejoin="round"/><path d="M 110 4 L 110 -44 C 110 -60, 320 -60, 320 -44 L 320 4" fill="none" stroke="#F6F8F8" stroke-width="13" stroke-linejoin="round"/>`;
  g += `<rect x="44" y="-30" width="38" height="34" rx="6" fill="#EEF4F6" stroke="#8E9BA0" stroke-width="3"/>`;
  for (let i = 0; i < 5; i++) g += `<line x1="${48}" y1="${-26 + i * 6}" x2="78" y2="${-26 + i * 6}" stroke="#B9C3C8" stroke-width="2"/>`;
  // floor stand
  g += `<path d="M 380 430 L 440 360 L 456 372 L 404 452 Z" fill="#7DB3E6" stroke="#3E7CC4" stroke-width="3"/><rect x="150" y="456" width="120" height="14" rx="5" fill="#DCE3E6" stroke="#B9C3C8" stroke-width="2"/>`;
  // case
  g += `<rect x="0" y="0" width="420" height="460" rx="16" fill="#F7F9FA" stroke="#B9C3C8" stroke-width="4"/>`;
  // A: dry suction dial
  const ang = -120 + 240 * cl(suc);
  g += `<rect x="14" y="40" width="124" height="104" rx="10" fill="#1E2428"/><circle cx="76" cy="92" r="36" fill="#F6F8F8"/><g transform="rotate(${ang} 76 92)"><rect x="70" y="58" width="12" height="40" rx="6" fill="#E0463C"/></g><circle cx="76" cy="92" r="6" fill="#B9C3C8"/>`;
  [["-10", 122, 64], ["-20", 92, 140], ["-30", 26, 104], ["-40", 70, 54]].forEach(([s, tx, ty]) => g += T(tx, ty, s, { size: 13, w: 700, fill: "#fff", anchor: "middle" }));
  // E: suction indicator (orange bellows rises to the arrow when suction is on)
  g += `<rect x="54" y="160" width="44" height="96" rx="6" fill="#E9EEF0" stroke="#B9C3C8" stroke-width="2"/><rect x="58" y="${252 - 80 * cl(suc)}" width="36" height="${4 + 80 * cl(suc)}" rx="4" fill="#E9573F"/><path d="M 66 264 L 76 254 L 86 264 Z" fill="#3E7CC4"/>`;
  // C: water seal / air leak monitor window
  g += `<path d="M 14 322 L 140 300 L 140 446 L 14 446 Z" fill="#DCEFFA" stroke="#7FA9C6" stroke-width="3"/><rect x="16" y="${444 - 110 * seal}" width="122" height="${110 * seal}" fill="#3E9AD8" opacity=".75"/><line x1="16" y1="392" x2="138" y2="392" stroke="#fff" stroke-width="4" stroke-dasharray="10 6"/>`;
  for (let i = 1; i <= 5; i++) g += `<line x1="${16 + i * 22}" y1="400" x2="${16 + i * 22}" y2="444" stroke="#fff" stroke-width="2" opacity=".8"/>` + T(6 + (6 - i) * 22, 438, String(i), { size: 14, w: 700, fill: "#fff", anchor: "middle" });
  if (bub > 0) for (let i = 0; i < 5; i++) { const k = (t * 1.3 + i / 5) % 1; g += `<circle cx="${50 + (i % 3) * 22}" cy="${440 - k * 60}" r="${5 + (i % 3) * 2}" fill="#fff" stroke="#1F6FB0" stroke-width="2" opacity="${bub * (1 - k * 0.6)}"/>`; }
  // D: three collection columns, filling right to left
  const cols = [[160, 66, cl(col * 3 - 2), 2000], [250, 66, cl(col * 3 - 1), 1000], [340, 62, cl(col * 3), 200]];
  cols.forEach(([cx, w, f, top]) => {
    g += `<rect x="${cx}" y="40" width="${w}" height="400" rx="6" fill="#FFFFFF" stroke="#C3CDD1" stroke-width="2.5"/><rect x="${cx + 3}" y="${437 - 394 * f}" width="${w - 6}" height="${394 * f}" rx="4" fill="#C9665A" opacity=".85"/>`;
    for (let i = 1; i < 10; i++) g += `<line x1="${cx + w - 16}" y1="${440 - i * 40}" x2="${cx + w - 2}" y2="${440 - i * 40}" stroke="#55636A" stroke-width="1.5"/>`;
    if (lab) for (let i = 2; i < 10; i += 3) g += T(cx + w - 20, 445 - i * 40, String(Math.round(top * i / 10)), { size: 13, w: 700, fill: "#55636A", anchor: "end" });
  });
  if (lab) g += `${T(76, 28, "Suction", { size: 18, w: 700, anchor: "middle", fill: C.muted })}${T(78, 292, "Water seal", { size: 17, w: 700, anchor: "middle", fill: C.muted })}${T(290, 28, "Collection (ml)", { size: 18, w: 700, anchor: "middle", fill: C.muted })}`;
  return g + `</g>`;
}
// chest with a clear chest tube (radio-opaque stripe, cm marks), blue connector, drainage tubing
function chest(o = {}) {
  let g = `<path d="M 120 120 C 160 60, 460 60, 500 120 L 540 640 C 420 700, 200 700, 80 640 Z" fill="${C.skinT}" stroke="${C.skinEdge}" stroke-width="3"/>`;
  g += `<path d="M 170 180 C 150 300, 150 470, 200 560 C 250 580, 290 560, 290 500 L 290 200 C 270 150, 200 150, 170 180 Z" fill="#F6D3CC" stroke="#D98C82" stroke-width="3" opacity=".8"/><path d="M 450 180 C 470 300, 470 470, 420 560 C 370 580, 330 560, 330 500 L 330 200 C 350 150, 420 150, 450 180 Z" fill="#F6D3CC" stroke="#D98C82" stroke-width="3" opacity=".8"/>`;
  if (o.tube ?? 1) {
    const tx = o.tx ?? 640, ty = o.ty ?? 520, D = `M 470 420 C 520 430, 560 470, ${tx} ${ty}`;
    const B = (k) => { const m = 1 - k; return [m * m * m * 470 + 3 * m * m * k * 520 + 3 * m * k * k * 560 + k * k * k * tx, m * m * m * 420 + 3 * m * m * k * 430 + 3 * m * k * k * 470 + k * k * k * ty]; };
    const [cx, cy] = B(0.45), [dx, dy] = B(0.5), ang = Math.atan2(dy - cy, dx - cx) * 180 / Math.PI;
    g += `<path d="M 470 420 L 400 400" stroke="#9FB5BD" stroke-width="20" stroke-linecap="round" opacity="${o.inside ?? 1}"/><path d="M 470 420 L 400 400" stroke="#F1F7F9" stroke-width="15" stroke-linecap="round" opacity="${o.inside ?? 1}"/><circle cx="418" cy="405" r="4" fill="#9FB5BD" opacity="${o.inside ?? 1}"/>`;
    g += `<path d="${D}" fill="none" stroke="#9FB5BD" stroke-width="22" stroke-linecap="round"/><path d="${D}" fill="none" stroke="#F1F7F9" stroke-width="17" stroke-linecap="round"/><path d="${D}" fill="none" stroke="#3E7CC4" stroke-width="3" transform="translate(0 -4)"/>`;
    g += `<g transform="translate(${cx} ${cy}) rotate(${ang})"><rect x="-22" y="-15" width="44" height="30" rx="6" fill="#2F7FD0" stroke="#1F5FA8" stroke-width="2.5"/><line x1="-8" y1="-15" x2="-8" y2="15" stroke="#1F5FA8" stroke-width="2"/><line x1="8" y1="-15" x2="8" y2="15" stroke="#1F5FA8" stroke-width="2"/></g>`;
    g += `<path d="M 462 412 l 16 16 M 478 412 l -16 16" stroke="#2B2F33" stroke-width="2.5"/>`;
  }
  if (o.dress) {
    let w = ""; for (let k = 1; k < 6; k++) w += `<line x1="${430 + k * 17}" y1="372" x2="${430 + k * 17}" y2="468" stroke="#DCE3E6" stroke-width="2"/><line x1="432" y1="${370 + k * 17}" x2="528" y2="${370 + k * 17}" stroke="#DCE3E6" stroke-width="2"/>`;
    g += `<g opacity="${o.dress}"><rect x="414" y="356" width="132" height="128" rx="12" fill="#EEF2F3" fill-opacity=".85" stroke="#C3CDD1" stroke-width="3"/><rect x="430" y="370" width="100" height="100" rx="6" fill="#fff" stroke="#B8C4C9" stroke-width="3"/>${w}</g>`;
  }
  return g;
}
function grid4(items, lt) {
  return items.map(([h, s], i) => { const x = 60 + (i % 2) * 510, y = 90 + Math.floor(i / 2) * 340, p = seg(lt, 0.3 + i * 0.5, 0.8 + i * 0.5);
    return `<g opacity="${p}" transform="translate(${x} ${y + (1 - p) * 30})"><rect width="490" height="310" rx="24" fill="${C.tealSoft}"/><circle cx="245" cy="115" r="62" fill="${C.teal}"/>${T(245, 132, String(i + 1), { size: 52, w: 800, anchor: "middle", fill: "#fff" })}${T(245, 235, h, { size: 40, w: 800, anchor: "middle" })}${T(245, 278, s, { size: 28, anchor: "middle", fill: C.muted })}</g>`; }).join("");
}
function record(title, rows, lt) {
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, title, { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="490" y1="${y + 42}" x2="940" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(490, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;
}
// ---------- Chest drain insertion scenes (Module 04, RMS.NCC.MW.F.004) ----------
add(4.5, { kind: "title" });
add(8, { step: 1, title: ["Know why", "it is needed"], bullets: ["Pneumothorax", "Haemothorax", "Pleural effusion", "After thoracic surgery"], draw: lt => grid4([["Pneumothorax", "Air in the pleural space"], ["Haemothorax", "Blood in the pleural space"], ["Pleural effusion", "Fluid in the pleural space"], ["Post-surgery", "After thoracic surgery"]], lt) });
add(9, { step: 2, title: ["Know the", "procedure and risks"], bullets: ["Pleural anatomy; site,\nposition and equipment", "Water-seal and\nsuction-assisted systems", "Bleeding, infection, surgical\nemphysema, lung injury", "Emergencies: tension\npneumothorax, equipment failure"], draw: lt => checkCards([["Procedure", "Site, positioning, equipment set-up"], ["Drainage systems", "Water seal · suction-assisted"], ["Complications", "Bleeding, infection, emphysema, lung injury"], ["Emergencies", "Tension pneumothorax · equipment failure"]], lt) });
add(9, { step: 3, title: ["Prepare the", "patient"], bullets: ["Identify the patient", "Consent obtained by\nthe doctor", "Analgesia as prescribed", "Position; Inco-pad under\nthe chest"], draw: lt => checkCards([["Patient identified", ""], ["Consent obtained by the doctor", ""], ["Analgesia given as prescribed", ""], ["Items assembled, expiry checked", ""], ["Hand hygiene, non-sterile gloves", ""], ["Positioned; Inco-pad under chest", ""]], lt, 80, 960, 104, 122, 50) });
add(9, { step: 4, crit: true, title: ["Prepare the", "water seal"], bullets: ["Hand hygiene and PPE", "Fill the water seal to\nthe marked level", "Make the connections"], draw: lt => {
  const f = seg(lt, 1.0, 3.4);
  let g = drainUnit(350, 200, { collect: 0, seal: f, suction: 0 });
  g += callout(560, 120, "Fill to the marked line", seg(lt, 1.4, 1.8), C.teal);
  return g + `<g opacity="${seg(lt, 3.6, 4.2)}">${tick(560, 730, 1)}${T(600, 742, "Water seal ready", { size: 30, w: 800, fill: C.green })}</g>`;
} });
add(8, { step: 5, crit: true, title: ["Sterile field;", "assist the doctor"], bullets: ["Chest drain set on a\nsterile field", "Strict aseptic technique", "Assist the doctor\nthroughout"], draw: lt => checkCards([["Sterile field", "Chest drain set opened aseptically"], ["Aseptic technique", "No breaks in sterility"], ["Assist the doctor", "Hand over what is needed"], ["Watch the patient", "Breathing, colour, pain"]], lt) });
add(9, { step: 6, title: ["Connect the", "system"], bullets: ["Connect the drainage\nsystem to the chest tube", "Connect to wall suction\nas ordered", "Unit upright, below\nthe chest"], draw: lt => {
  const c = seg(lt, 0.8, 2.2), s = seg(lt, 3.0, 4.2);
  let g = chest({ tx: lerp(560, 682, c), ty: lerp(500, 345, c) });
  g += drainUnit(620, 360, { collect: 0.05, seal: 1, suction: s, t: lt, bubble: 0, labels: 0 });
  g += `<g opacity="${s}"><path d="M 975 360 C 980 260, 1000 200, 1060 160" fill="none" stroke="#8DA9B4" stroke-width="12"/><rect x="1040" y="110" width="60" height="60" rx="10" fill="${C.ink}"/></g>`;
  return g + callout(840, 300, "Wall suction as ordered", seg(lt, 3.4, 3.8), C.teal) + callout(830, 860 - 40, "Below chest level", seg(lt, 4.6, 5.0), C.teal);
} });
add(8, { step: 7, crit: true, title: ["Chest X-ray", "urgently"], bullets: ["Arrange the chest X-ray\nurgently", "Sharps into the sharps bin", "Clean the trolley;\nhand hygiene"], draw: lt => checkCards([["Urgent chest X-ray", "Confirms the tube position"], ["Sharps disposed", "Into the correct container"], ["Equipment cleared", "Trolley cleaned"], ["Hand hygiene", ""]], lt) });
add(10, { step: 8, crit: true, title: ["Monitor after", "insertion"], bullets: ["Vital signs as per policy", "Analgesia", "Drainage amount and colour", "Air leak; water levels in\nsuction and air leak chambers"], draw: lt => {
  let g = drainUnit(120, 220, { collect: lerp(0.05, 0.3, seg(lt, 0.5, 6)), seal: 1, suction: 1, bubble: seg(lt, 3.0, 3.6), t: lt });
  g += callout(780, 260, "Amount and colour", seg(lt, 1.0, 1.4), C.teal) + callout(780, 380, "Air leak: bubbling?", seg(lt, 3.0, 3.4), C.teal) + callout(780, 500, "Water levels correct", seg(lt, 4.6, 5.0), C.teal);
  return g + callout(780, 620, "Vital signs · analgesia", seg(lt, 6.0, 6.4), C.teal);
} });
add(8, { step: 9, warn: true, title: ["Sudden", "deterioration"], bullets: ["Tension pneumothorax", "Equipment failure", "Call for help; follow the\nemergency protocol"], draw: lt => checkCards([["Tension pneumothorax", "Sudden breathlessness, falling SpO₂"], ["Equipment failure", "Disconnection, broken unit"]], lt, 80, 960, 150, 190, 150, C.red) + callout(560, 620, "Call for help · emergency protocol", seg(lt, 2.4, 3.0), C.red) });
add(7, { step: 10, title: ["Care for the", "person"], bullets: ["Calm and supportive", "Privacy and draping", "Respond to discomfort", "Ask when unsure"], draw: lt => checkCards([["Calm and supportive", "Promotes cooperation"], ["Dignity", "Draping, minimal exposure"], ["Responsive", "Act on pain or concern"], ["Accountable", "Seek guidance when unsure"]], lt) });
add(9, { step: 11, title: ["Document the", "procedure"], bullets: ["Date, time, indication, site;\nwho did and assisted", "Baseline vitals, oxygen,\nconsent check", "Tube type and size, system,\ncomplications", "Post-procedure observations"], draw: lt => record("Chest drain insertion", [["Date / time / site", "30/10 · 11:20 · R 5th ICS"], ["Indication", "Pleural effusion"], ["Team", "Dr name · RN name"], ["Baseline", "Vitals · SpO₂ 94% on 2 L"], ["Tube / system", "24 Fr · water seal + suction"], ["Complications", "None"], ["After", "Drained 300 ml · no air leak"]], lt) });
add(5, { kind: "end" });

const DURS = [5.25, 9.05, 20.29, 21.19, 12.83, 10.46, 11.55, 11.38, 17.86, 10.5, 9.76, 16.82, 5]; SCENES.forEach((s, i) => s.dur = DURS[i]);
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt) {
  const p = seg(lt, 0, 0.5);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 40} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) g += `<rect x="1362" y="174" width="300" height="52" rx="26" fill="${C.red}"/>${T(1512, 210, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}`;
  g += `</g>`;
  s.bullets.forEach((b, i) => {
    const q = seg(lt, 0.6 + i * 0.5, 1.0 + i * 0.5);
    g += `<g opacity="${q}"><rect x="1250" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    b.split("\n").forEach(l => { g += T(1284, y, l, { size: 34, w: 500 }); y += 46; });
    g += `</g>`; y += 22;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "CHEST DRAIN INSERTION", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(455, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "Chest drain", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "insertion", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Assisting the doctor \u00b7 step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 540)"><circle r="190" fill="#fff" opacity=".12"/><rect x="-110" y="-130" width="220" height="260" rx="20" fill="#fff" opacity=".95"/><rect x="-96" y="-20" width="80" height="136" rx="8" fill="#D9867A"/><rect x="-6" y="50" width="44" height="66" rx="8" fill="#9FD3EA"/><rect x="48" y="-10" width="44" height="126" rx="8" fill="#BFE3F2"/><path d="M -60 -130 C -60 -200, -160 -200, -170 -150" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review \u00b7 Module 04 \u00b7 RMS.NCC.MW.F.004 \u00b7 follow hospital policy", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow hospital policy and aseptic technique.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0;
  for (const sc of SCENES) { if (t < acc + sc.dur) { s = sc; lt = t - acc; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = `<rect width="1920" height="1080" fill="${C.bg}"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    g += chrome(s);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(60 130)"><rect width="1120" height="840" rx="28" fill="#fff" stroke="${C.line}" stroke-width="2"/><g clip-path="url(#card)">${s.draw(lt)}</g></g>`;
    g += textPanel(s, lt);
  }
  // fade from previous scene
  const fin = clamp(lt / 0.35), fout = clamp((s.dur - lt) / 0.35);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="${C.bg}" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
</body></html>
