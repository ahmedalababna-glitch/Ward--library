<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0, col = C.glove, edge = C.gloveEdge) {
  // gloved hand seen from above: palm, four fingers and thumb, sized by rx
  const s = rx / 60;
  const f = [[-27, -64, 15, 46], [-9, -76, 15, 58], [9, -72, 15, 54], [27, -58, 14, 42]].map(([fx, fy, w, h]) => `<rect x="${fx - w / 2}" y="${fy}" width="${w}" height="${h}" rx="${w / 2}" fill="${col}" stroke="${edge}" stroke-width="2.5"/>`).join("");
  return `<g transform="translate(${x} ${y}) rotate(${rot + 90}) scale(${s})">${f}<rect x="-62" y="-14" width="44" height="17" rx="8.5" transform="rotate(-35 -40 -6)" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -38 -26 C -38 -40, 38 -40, 38 -26 L 36 34 C 30 48, -30 48, -36 34 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/><path d="M -30 48 L 30 48 L 32 70 L -32 70 Z" fill="${col}" stroke="${edge}" stroke-width="2.5"/></g>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}

function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    const y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${col === C.red ? C.redSoft : C.bg}"/>${T(150, sub ? 62 : h / 2 + 13, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${col === C.red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk)}</g>`;
  }).join("");
}

// ---------- TPN scenes (Module 04, RMS.NCC.MW.F.006) ----------
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));

function grid4(items, lt) {
  return items.map(([h, s], i) => { const x = 60 + (i % 2) * 510, y = 90 + Math.floor(i / 2) * 340, p = seg(lt, 0.3 + i * 0.5, 0.8 + i * 0.5);
    return `<g opacity="${p}" transform="translate(${x} ${y + (1 - p) * 30})"><rect width="490" height="310" rx="24" fill="${C.tealSoft}"/><circle cx="245" cy="115" r="62" fill="${C.teal}"/>${T(245, 132, String(i + 1), { size: 52, w: 800, anchor: "middle", fill: "#fff" })}${T(245, 235, h, { size: 40, w: 800, anchor: "middle" })}${T(245, 278, s, { size: 28, anchor: "middle", fill: C.muted })}</g>`; }).join("");
}
function tpnBag(x, y, s = 1, label = true) {
  // compounded PN bag: hanger tab, milky contents, printed label, ml scale, two bottom ports
  let g = `<g transform="translate(${x} ${y}) scale(${s})"><path d="M 50 -34 h 60 v 40 h -60 Z" fill="#EEF2F3" stroke="#AFC0C6" stroke-width="3"/><circle cx="80" cy="-16" r="9" fill="#fff" stroke="#AFC0C6" stroke-width="3"/>`;
  g += `<path d="M 10 0 H 150 Q 160 0 160 12 V 290 Q 160 330 120 336 H 40 Q 0 330 0 290 V 12 Q 0 0 10 0 Z" fill="#FBF7EC" stroke="#AFC0C6" stroke-width="4"/><path d="M 4 120 H 156 V 290 Q 156 326 120 332 H 40 Q 4 326 4 290 Z" fill="#F6EBC4" opacity=".85"/>`;
  for (let i = 1; i <= 5; i++) g += `<line x1="138" y1="${310 - i * 40}" x2="156" y2="${310 - i * 40}" stroke="#8FA3AA" stroke-width="2"/>`;
  if (label) g += `<rect x="16" y="26" width="116" height="84" rx="6" fill="#fff" stroke="#8FA3AA" stroke-width="2"/><rect x="16" y="26" width="116" height="18" rx="4" fill="${C.teal}"/>${T(74, 40, "PN", { size: 13, w: 800, anchor: "middle", fill: "#fff" })}<line x1="26" y1="62" x2="120" y2="62" stroke="${C.ink}" stroke-width="3"/><line x1="26" y1="80" x2="104" y2="80" stroke="${C.muted}" stroke-width="3"/><line x1="26" y1="96" x2="114" y2="96" stroke="${C.muted}" stroke-width="3"/>`;
  g += `<rect x="52" y="334" width="18" height="38" rx="4" fill="#E9EEF0" stroke="#8FA3AA" stroke-width="2"/><rect x="50" y="368" width="22" height="12" rx="3" fill="#3B8DB5"/><rect x="90" y="334" width="18" height="38" rx="4" fill="#E9EEF0" stroke="#8FA3AA" stroke-width="2"/><rect x="88" y="368" width="22" height="12" rx="3" fill="#D0453D"/>`;
  return g + `</g>`;
}
function record(title, rows, lt) {
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, title, { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="490" y1="${y + 42}" x2="940" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(490, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;
}

add(4.5, { kind: "title" });
add(9, { step: 1, title: ["Know", "TPN"], bullets: ["Indications, components\nand goals", "Central or peripheral access:\nthe rationale", "TPN vs enteral nutrition", "Nutritional needs;\nteam planning"], draw: lt => grid4([["Indications", "Gut can't be used enough"], ["Components", "Dextrose, amino acids, lipids…"], ["Route", "Central or peripheral access"], ["Team", "Dietitian · pharmacist · doctor"]], lt) });
add(9, { step: 2, title: ["Know the", "risks"], bullets: ["Metabolic, mechanical,\ninfectious", "CRBSI, hyperglycaemia,\nelectrolyte imbalance", "Watch glucose, electrolytes,\nliver function", "Start, adjust and stop\nby protocol"], draw: lt => checkCards([["Infection (CRBSI)", "Fever, rigors, line site redness"], ["Hyperglycaemia", "Check blood glucose"], ["Electrolyte imbalance", "Check electrolytes"], ["Liver function", "Check LFTs"]], lt, 80, 960, 140, 170, 110, C.red) + callout(560, 800, "Start · titrate · stop by protocol", seg(lt, 3.4, 4.0), C.teal) });
add(9, { step: 3, title: ["Prepare the", "patient"], bullets: ["Hand hygiene and PPE", "Introduce yourself; authorised\npatient identifiers", "Explain; verbal consent", "Check the order; equipment;\nsterile field"], draw: lt => checkCards([["Hand hygiene and PPE", ""], ["Patient identified", "Authorised identifiers"], ["Explained · verbal consent", "Patient or relatives"], ["Physician order checked", ""], ["Equipment organised", ""], ["Sterile field prepared", ""]], lt, 80, 960, 104, 122, 50) });
add(10, { step: 4, crit: true, title: ["Check the label", "with a second nurse"], bullets: ["Compare the TPN label with\nthe physician's order", "Counter-check with\nanother staff member", "Stick the label on the bottle"], draw: lt => {
  let g = tpnBag(170, 200, 1.15);
  g += `<g transform="translate(560 160)"><rect width="420" height="420" rx="20" fill="#fff" stroke="${C.line}" stroke-width="3"/>${T(210, 60, "Physician's order", { size: 30, w: 800, anchor: "middle", fill: C.teal })}`;
  [["Patient", 0.6], ["Formula", 1.2], ["Volume", 1.8], ["Rate", 2.4], ["Additives", 3.0]].forEach(([l, t0], i) => { g += `${T(40, 130 + i * 60, l, { size: 28, w: 700 })}${tick(360, 120 + i * 60, 0.7, seg(lt, t0, t0 + 0.4))}`; });
  g += `</g>`;
  g += `<g opacity="${seg(lt, 3.8, 4.4)}"><circle cx="680" cy="700" r="44" fill="${C.teal}"/>${T(680, 712, "RN 1", { size: 24, w: 800, anchor: "middle", fill: "#fff" })}<circle cx="860" cy="700" r="44" fill="${C.teal}"/>${T(860, 712, "RN 2", { size: 24, w: 800, anchor: "middle", fill: "#fff" })}</g>`;
  return g + callout(770, 800, "Two-nurse check", seg(lt, 4.0, 4.4), C.red);
} });
add(10, { step: 5, crit: true, title: ["Two-person", "aseptic set-up"], bullets: ["Assistant: opens the IV set,\nsyringes and needles", "Assistant: removes the\nwrapping; alcohol wipe", "Other nurse: gloves on;\nstarts the infusion"], draw: lt => {
  let g = `<rect x="60" y="80" width="480" height="680" rx="24" fill="${C.bg}"/><rect x="580" y="80" width="480" height="680" rx="24" fill="${C.tealSoft}"/>${T(300, 140, "Assisting staff", { size: 32, w: 800, anchor: "middle", fill: C.muted })}${T(820, 140, "Other nurse", { size: 32, w: 800, anchor: "middle", fill: C.teal })}`;
  [["Opens the IV set", 0.6], ["Opens syringes, needles", 1.4], ["Removes bottle wrapping", 2.2], ["Wipes with alcohol swab", 3.0]].forEach(([l, t0], i) => { g += `<g opacity="${seg(lt, t0, t0 + 0.5)}"><rect x="90" y="${200 + i * 130}" width="420" height="100" rx="18" fill="#fff"/>${T(300, 260 + i * 130, l, { size: 28, w: 700, anchor: "middle" })}</g>`; });
  [["Sterile gloves on", 3.8], ["Starts the infusion", 4.6]].forEach(([l, t0], i) => { g += `<g opacity="${seg(lt, t0, t0 + 0.5)}"><rect x="610" y="${200 + i * 130}" width="420" height="100" rx="18" fill="#fff"/>${T(820, 260 + i * 130, l, { size: 28, w: 700, anchor: "middle" })}</g>`; });
  return g;
} });
add(10, { step: 6, crit: true, title: ["Connect and", "protect the line"], bullets: ["Attach the TPN tubing to\nthe central line port", "Cover the ports with sterile\ngauze and tape", "Wrap the limbs in a small\ngreen towel", "Remove gloves; position\nthe patient"], draw: lt => {
  let g = `<rect x="0" y="0" width="1120" height="840" fill="${C.skinT}"/>`;
  g += `<g transform="translate(380 420) rotate(-20)"><rect x="-200" y="-12" width="210" height="24" rx="11" fill="#F4F8F9" stroke="#93A7AE" stroke-width="3"/><path d="M 0 -16 L 10 -36 L 60 -42 L 60 42 L 10 36 L 0 16 Z" fill="#DDE6E9" stroke="#93A7AE" stroke-width="3"/>`;
  [["#8B5A2B", -30], ["#3B6FD6", 0], ["#E9E9E9", 30]].forEach(([c, dy]) => { const y2 = dy * 2;
    g += `<line x1="60" y1="${dy * 0.6}" x2="256" y2="${y2}" stroke="#93A7AE" stroke-width="14" stroke-linecap="round"/><line x1="60" y1="${dy * 0.6}" x2="256" y2="${y2}" stroke="#F4F8F9" stroke-width="9" stroke-linecap="round"/><rect x="140" y="${(dy * 0.6 + y2) / 2 - 16}" width="32" height="32" rx="5" fill="${c}" stroke="#6E7B80" stroke-width="2"/><rect x="252" y="${y2 - 15}" width="30" height="30" rx="5" fill="${c}" stroke="#6E7B80" stroke-width="2"/><rect x="280" y="${y2 - 12}" width="22" height="24" rx="7" fill="#EEF6F8" stroke="#8FA3AA" stroke-width="2"/>`; });
  const at = seg(lt, 0.8, 2.0);
  g += `<g opacity="${at}"><path d="M 302 0 C ${360 + 200 * (1 - at)} 0, 500 -120, 700 -260" fill="none" stroke="#AFC0C6" stroke-width="12"/><path d="M 302 0 C ${360 + 200 * (1 - at)} 0, 500 -120, 700 -260" fill="none" stroke="#F6EBC4" stroke-width="7"/></g>`;
  const gz = seg(lt, 2.6, 3.4), tw = seg(lt, 4.2, 5.2);
  g += `<g opacity="${gz * (1 - tw * 0.6)}"><rect x="230" y="-110" width="110" height="220" rx="8" fill="#fff" stroke="#C8D2D6" stroke-width="3"/>${[1, 2, 3].map(k => `<line x1="${230 + k * 27}" y1="-108" x2="${230 + k * 27}" y2="108" stroke="#E2E8EA" stroke-width="2"/>`).join("")}${[1, 2, 3, 4, 5, 6].map(k => `<line x1="232" y1="${-110 + k * 31}" x2="338" y2="${-110 + k * 31}" stroke="#E2E8EA" stroke-width="2"/>`).join("")}<rect x="216" y="-40" width="140" height="22" rx="4" fill="#F1F4F5" stroke="#C8D2D6" stroke-width="2" opacity=".9"/><rect x="216" y="20" width="140" height="22" rx="4" fill="#F1F4F5" stroke="#C8D2D6" stroke-width="2" opacity=".9"/></g>`;
  g += `<rect x="40" y="-150" width="320" height="300" rx="30" fill="#4E9A6B" opacity="${tw * 0.92}"/></g>`;
  return g + callout(800, 120, "TPN tubing to the port", seg(lt, 1.0, 1.4), C.teal) + callout(800, 620, "Sterile gauze + tape", seg(lt, 2.8, 3.2), C.teal) + callout(800, 700, "Small green towel", seg(lt, 4.4, 4.8), C.teal);
} });
add(8, { step: 7, title: ["Set the", "pump"], bullets: ["Set the infusion pump to\nthe prescribed volume", "Dispose of equipment;\nwash hands", "Check the pump every hour"], draw: lt => {
  const v = Math.round(lerp(0, 83, seg(lt, 0.8, 2.6)));
  let g = tpnBag(150, 120, 0.9, false) + `<path d="M 222 462 C 222 520, 300 560, 470 560" fill="none" stroke="#AFC0C6" stroke-width="11"/><path d="M 222 462 C 222 520, 300 560, 470 560" fill="none" stroke="#F6EBC4" stroke-width="6"/>`;
  g += `<rect x="940" y="60" width="18" height="760" rx="6" fill="#B9C6CB"/><g transform="translate(420 260)"><rect x="80" y="-34" width="260" height="40" rx="20" fill="none" stroke="#9DB0B6" stroke-width="12"/><rect width="440" height="500" rx="34" fill="#E9EEF0" stroke="#8DA9B4" stroke-width="5"/><rect x="440" y="200" width="80" height="60" rx="10" fill="#B9C6CB"/>`;
  g += `<rect x="36" y="36" width="250" height="160" rx="12" fill="#13343A"/>${T(56, 80, "RATE", { size: 20, w: 700, fill: "#7FD1C7" })}${T(270, 150, v + " ml/h", { size: 52, w: 800, fill: "#E8FFFB", anchor: "end" })}${T(56, 182, "VTBI 2000 ml", { size: 18, w: 700, fill: "#7FD1C7" })}`;
  g += [0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${306 + c * 40}" y="${40 + r * 52}" width="32" height="42" rx="8" fill="#fff" stroke="#AFC0C6" stroke-width="2"/>`).join("")).join("");
  g += `<rect x="36" y="230" width="368" height="170" rx="14" fill="#DCE4E7" stroke="#AFC0C6" stroke-width="3"/><path d="M 60 300 H 380" stroke="#AFC0C6" stroke-width="12"/><path d="M 60 300 H 380" stroke="#F6EBC4" stroke-width="6"/>${T(220, 270, "Pump door: tubing channel", { size: 18, w: 700, anchor: "middle", fill: C.muted })}`;
  g += `<rect x="60" y="420" width="90" height="50" rx="12" fill="${C.green}"/>${T(105, 452, "START", { size: 16, w: 800, anchor: "middle", fill: "#fff" })}<rect x="175" y="420" width="90" height="50" rx="12" fill="#C9D2D8"/>${T(220, 452, "PAUSE", { size: 16, w: 800, anchor: "middle" })}<rect x="290" y="420" width="90" height="50" rx="12" fill="${C.red}"/>${T(335, 452, "STOP", { size: 16, w: 800, anchor: "middle", fill: "#fff" })}</g>`;
  return g + callout(630, 820 - 40, "Check the pump hourly", seg(lt, 3.6, 4.0), C.teal);
} });
add(10, { step: 8, crit: true, title: ["Monitor", "closely"], bullets: ["Vital signs every 4–8 hours", "Blood glucose every 6 hours", "Central line site every shift", "Site care every 48 hours\n(infection control manual)"], draw: lt => {
  const st = [["Pump", "every hour"], ["Vitals", "every 4–8 h"], ["Glucose", "every 6 h"], ["Line site", "every shift"], ["Site care", "every 48 h"]];
  let g = "";
  st.forEach(([h, s], i) => { const x = 40 + i * 212, p = seg(lt, 0.5 + i * 0.8, 1.0 + i * 0.8);
    g += `<g opacity="${p}" transform="translate(${x} ${280 + (1 - p) * 30})"><rect width="190" height="260" rx="22" fill="${i === 2 ? C.redSoft : C.bg}"/><circle cx="95" cy="70" r="40" fill="${i === 2 ? C.red : C.teal}"/>${T(95, 86, String(i + 1), { size: 40, w: 800, anchor: "middle", fill: "#fff" })}${T(95, 168, h, { size: 30, w: 800, anchor: "middle" })}${T(95, 210, s, { size: 26, anchor: "middle", fill: C.muted })}</g>`; });
  return g;
} });
add(8, { step: 9, crit: true, title: ["Never leave", "TPN unattended"], bullets: ["Never leave TPN solutions\nunattended", "TPN and lipids on rolling\ninfusion pumps", "Encourage walking\nif allowed"], draw: lt => checkCards([["TPN left unattended", "Never"]], lt, 80, 960, 160, 190, 120, C.red) + checkCards([["Rolling infusion pumps", "For TPN and lipids"], ["Encourage ambulation", "If allowed"]], Math.max(0, lt - 1.2), 80, 960, 160, 190, 340) });
add(8, { step: 10, title: ["Care for the", "person"], bullets: ["Strict sterile technique", "Vigilant for reactions", "Respectful teamwork", "Empathy, dignity, privacy"], draw: lt => checkCards([["Sterile technique", "Infection prevention every time"], ["Vigilance", "Watch for adverse reactions"], ["Teamwork", "Collaborative, respectful"], ["Empathy and dignity", "Educate patient and family"]], lt) });
add(10, { step: 11, title: ["Document and", "report"], bullets: ["Prescription, times, rates", "Vitals, fluid balance, labs;\ndaily weight", "e-Kardex signed by\ntwo registered nurses", "Report intolerance at once"], draw: lt => record("TPN record", [["Prescription", "Formula as ordered"], ["Started / rate", "30/10 · 18:00 · 83 ml/h"], ["e-Kardex", "Signed by RN 1 + RN 2"], ["Glucose", "8.2 mmol/L at 00:00"], ["Weight", "Daily · 64.5 kg"], ["Intake / output", "TPN + oral recorded"], ["Line site", "Clean · dressing 30/10"]], lt) });
add(5, { kind: "end" });

const DURS = [6.6, 16.97, 19.7, 19.04, 11.38, 16.2, 16.11, 10.4, 16.07, 12.98, 13.28, 21.96, 5]; SCENES.forEach((s, i) => s.dur = DURS[i]);
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt) {
  const p = seg(lt, 0, 0.5);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 40} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) g += `<rect x="1362" y="174" width="300" height="52" rx="26" fill="${C.red}"/>${T(1512, 210, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}`;
  g += `</g>`;
  s.bullets.forEach((b, i) => {
    const q = seg(lt, 0.6 + i * 0.5, 1.0 + i * 0.5);
    g += `<g opacity="${q}"><rect x="1250" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    b.split("\n").forEach(l => { g += T(1284, y, l, { size: 34, w: 500 }); y += 46; });
    g += `</g>`; y += 22;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "TPN", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(118, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "Total parenteral", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "nutrition (TPN)", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Safe administration and monitoring \u00b7 step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 500)"><circle r="190" fill="#fff" opacity=".12" transform="translate(0 40)"/><rect x="-40" y="-170" width="80" height="30" rx="8" fill="#fff" opacity=".7"/><path d="M -90 -140 H 90 V 150 Q 0 210 -90 150 Z" fill="#FFF6DD"/><rect x="-90" y="-20" width="180" height="170" fill="#F7E7B0"/><rect x="-60" y="-110" width="120" height="70" rx="8" fill="#fff"/><path d="M 0 185 C 0 260, 80 280, 160 260" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review \u00b7 Module 04 \u00b7 RMS.NCC.MW.F.006 \u00b7 follow hospital policy", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow hospital policy and sterile technique.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0;
  for (const sc of SCENES) { if (t < acc + sc.dur) { s = sc; lt = t - acc; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = `<rect width="1920" height="1080" fill="${C.bg}"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    g += chrome(s);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(60 130)"><rect width="1120" height="840" rx="28" fill="#fff" stroke="${C.line}" stroke-width="2"/><g clip-path="url(#card)">${s.draw(lt)}</g></g>`;
    g += textPanel(s, lt);
  }
  // fade from previous scene
  const fin = clamp(lt / 0.35), fout = clamp((s.dur - lt) / 0.35);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="${C.bg}" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
