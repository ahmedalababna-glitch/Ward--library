<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "PlexAr"; src: url("ibm-plex-sans-arabic-arabic-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; background: #F3F6F7; }
svg { display: block; }
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = { bg: "#F3F6F7", ink: "#12262B", muted: "#5E747A", teal: "#0B6E75", tealSoft: "#DCEFEF", red: "#D0453D", redSoft: "#FBE3E1", green: "#1F8A4C", greenSoft: "#DDF2E5",
  line: "#DCE4E6", skinT: "#F3C9A8", skin: "#EBB792", skinB: "#D9A27E", skinEdge: "#C98F68", vein: "#4F72B8", glove: "#6F8FE0", gloveEdge: "#4D68B8", pink: "#E8679E", steel: "#9AA5AD", yellow: "#F2C200" };
const FONT = "Inter, 'Liberation Sans', sans-serif", AR = "PlexAr, sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-family="${o.ar ? AR : FONT}" font-size="${o.size || 32}" font-weight="${o.w || 400}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || "start"}" ${o.ar ? 'direction="rtl"' : ""} ${o.ls ? `letter-spacing="${o.ls}"` : ""} opacity="${o.op ?? 1}">${esc(s)}</text>`;

// ---------- shared drawings (card space 1120 x 840) ----------
const SITE = { x: 620, y: 428 };
function armTop() {
  return `<defs><linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skinT}"/><stop offset=".55" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinB}"/></linearGradient></defs>
  <path d="M -40 300 C 300 294, 700 310, 960 336 L 960 534 C 700 554, 300 566, -40 566 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M 940 330 C 1040 318, 1120 345, 1180 382 L 1180 500 C 1110 542, 1030 550, 940 540 Z" fill="url(#skinG)" stroke="${C.skinEdge}" stroke-width="3"/>
  <path d="M -40 442 C 250 424, 450 446, 620 428 S 880 438 960 432" fill="none" stroke="${C.vein}" stroke-width="18" stroke-linecap="round" opacity=".5"/>
  <path d="M 380 437 C 430 400, 470 380, 540 372" fill="none" stroke="${C.vein}" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  ${T(30, 620, "Elbow", { size: 24, fill: C.muted })}${T(1060, 600, "Hand", { size: 24, fill: C.muted, anchor: "middle" })}`;
}
function cross(x, y, s = 30, op = 1) {
  return `<g stroke="${C.red}" stroke-width="10" stroke-linecap="round" opacity="${op}"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function tick(x, y, s = 1, op = 1, col = C.green) {
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}"/><path d="M -11 1 l 8 8 l 15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function tourniquet(x, op = 1, dy = 0) {
  return `<g opacity="${op}" transform="translate(0 ${dy})"><rect x="${x - 34}" y="282" width="68" height="302" rx="14" fill="#2E8C8C"/><rect x="${x - 48}" y="400" width="96" height="66" rx="10" fill="#1C3D40"/><rect x="${x - 30}" y="418" width="60" height="30" rx="5" fill="#2E8C8C"/></g>`;
}
function cannulaTop(o = {}) {
  // inserted cannula seen from above: catheter runs under the skin towards the elbow
  const x = SITE.x, y = SITE.y;
  let g = `<line x1="${x - 150}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55" stroke-dasharray="14 10"/>`;
  g += `<rect x="${x - 4}" y="${y - 10}" width="30" height="20" rx="6" fill="#fff" stroke="#B9C3C8" stroke-width="2"/>`;
  g += `<path d="M ${x + 26} ${y - 22} L ${x + 76} ${y - 26} L ${x + 76} ${y + 26} L ${x + 26} ${y + 22} Z" fill="${C.pink}"/>`;
  g += `<path d="M ${x + 34} ${y - 22} L ${x + 44} ${y - 70} L ${x + 70} ${y - 70} L ${x + 66} ${y - 24} Z M ${x + 34} ${y + 22} L ${x + 44} ${y + 70} L ${x + 70} ${y + 70} L ${x + 66} ${y + 24} Z" fill="${C.pink}" opacity=".9"/>`;
  if (o.needle) {
    const nx = (o.nx || 0), ny = (o.ny || 0);
    g += `<g transform="translate(${nx} ${ny})" opacity="${o.nop ?? 1}"><rect x="${x + 76}" y="${y - 18}" width="70" height="36" rx="6" fill="#fff" stroke="${C.steel}" stroke-width="3"/><rect x="${x + 82}" y="${y - 12}" width="40" height="24" rx="4" fill="${C.red}"/><rect x="${x + 146}" y="${y - 14}" width="80" height="28" rx="6" fill="#C9D2D8"/></g>`;
  }
  if (o.cap) g += `<rect x="${x + 76}" y="${y - 14}" width="26" height="28" rx="5" fill="${C.pink}"/>`;
  return g;
}
function sharpsBin(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="20" width="170" height="160" rx="12" fill="${C.yellow}" stroke="#9A7A00" stroke-width="3"/><rect x="-6" y="0" width="182" height="34" rx="8" fill="${C.red}"/><rect x="60" y="6" width="50" height="10" rx="5" fill="#7a1d18"/>${T(85, 118, "SHARPS", { size: 24, w: 800, anchor: "middle", fill: "#3a2f00" })}</g>`;
}
function glove(x, y, rx = 60, ry = 36, rot = 0) {
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})" fill="${C.glove}" stroke="${C.gloveEdge}" stroke-width="3"/>`;
}
function arrow(x1, y1, x2, y2, col = C.ink, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 18;
  return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path d="M ${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`;
}
function callout(x, y, text, op = 1, col = C.ink) {
  const w = text.length * 15 + 40;
  return `<g opacity="${op}"><rect x="${x - w / 2}" y="${y - 30}" width="${w}" height="46" rx="10" fill="${col}"/>${T(x, y + 1, text, { size: 26, w: 700, anchor: "middle", fill: "#fff" })}</g>`;
}

// side cut-away of skin, vein and cannula
const E = { x: 760, y: 300 };
function crossSection(st) {
  let g = `<rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/>
    <rect x="0" y="300" width="1120" height="14" fill="#D99B74"/>
    <rect x="0" y="314" width="1120" height="36" fill="#EDBD9A"/>
    <rect x="0" y="350" width="1120" height="490" fill="#F6D7BE"/>
    <rect x="0" y="360" width="1120" height="52" fill="${C.vein}"/>
    <rect x="0" y="368" width="1120" height="36" fill="#7E9AD4" opacity=".55"/>
    ${T(24, 296, "Skin surface", { size: 22, fill: C.muted })}
    ${T(24, 392, "Vein", { size: 24, w: 700, fill: "#fff" })}
    ${T(24, 470, "Tissue", { size: 22, fill: C.muted })}`;
  const a = st.a * Math.PI / 180, tx = E.x - st.depth * Math.cos(a), ty = E.y + st.depth * Math.sin(a);
  let dev = "";
  if (!st.noNeedle) dev += `<g transform="translate(${st.nOff || 0} 0)" opacity="${st.nOp ?? 1}">
      <line x1="0" y1="0" x2="640" y2="0" stroke="${C.steel}" stroke-width="5"/>
      <path d="M 0 0 L 22 -4 L 22 4 Z" fill="${C.steel}"/>
      <rect x="452" y="-20" width="84" height="40" rx="7" fill="#fff" stroke="${C.steel}" stroke-width="3"/>
      <rect x="456" y="-16" width="${76 * (st.flash || 0)}" height="32" rx="4" fill="${C.red}"/>
      <rect x="536" y="-15" width="120" height="30" rx="7" fill="#C9D2D8"/></g>`;
  dev += `<g transform="translate(${st.cOff || 0} 0)">
      <rect x="24" y="-8" width="350" height="16" rx="8" fill="#FFFFFF" fill-opacity=".72" stroke="#AEB9BE" stroke-width="2"/>
      <rect x="372" y="-22" width="82" height="44" rx="9" fill="${C.pink}"/>
      <rect x="390" y="-40" width="44" height="16" rx="4" fill="${C.pink}"/></g>`;
  g += `<g transform="translate(${tx} ${ty}) rotate(${-st.a})" opacity="${st.op ?? 1}">${dev}</g>`;
  // tip position helpers for callouts
  st._tip = { x: tx, y: ty };
  st._axis = (d) => ({ x: tx + d * Math.cos(a), y: ty - d * Math.sin(a) });
  return g;
}

// ---------- NG tube scenes (Module 04, RMS.NCC.MW.F.007) ----------
const SCENES = [];
const add = (dur, o) => SCENES.push(Object.assign({ dur }, o));

// side-view patient: head facing right, chest and stomach below
const NOSE = { x: 505, y: 255 }, EAR = { x: 330, y: 228 }, XIPH = { x: 492, y: 610 };
const TUBE_PATH = "M 498 262 C 450 258, 400 250, 372 262 C 350 274, 352 300, 352 330 L 352 420 C 352 500, 356 560, 372 640 C 384 690, 420 710, 455 712";
function patient(o = {}) {
  let g = `<defs><linearGradient id="skinP" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${C.skinB}"/><stop offset="1" stop-color="${C.skinT}"/></linearGradient></defs>`;
  g += `<path d="M 200 430 C 260 404, 430 404, 540 436 L 640 840 L 110 840 Z" fill="#CFE3EA" stroke="#9DB9C3" stroke-width="3"/>`; // gown / chest
  g += `<path d="M 300 360 L 300 440 L 420 440 L 410 350 Z" fill="url(#skinP)" stroke="${C.skinEdge}" stroke-width="3"/>`; // neck
  g += `<path d="M 250 90 C 330 38, 455 58, 474 150 L 482 205 L 508 254 L 474 270 L 480 298 L 466 322 C 458 346, 426 352, 404 346 L 300 380 C 230 340, 196 200, 250 90 Z" fill="url(#skinP)" stroke="${C.skinEdge}" stroke-width="3"/>`;
  g += `<ellipse cx="${EAR.x}" cy="${EAR.y - 10}" rx="22" ry="34" fill="${C.skin}" stroke="${C.skinEdge}" stroke-width="3"/>`;
  g += `<path d="M 444 196 q 14 -6 26 0" stroke="${C.skinEdge}" stroke-width="4" fill="none" stroke-linecap="round"/>`; // eye
  if (o.anatomy) {
    g += `<g opacity="${o.anatomy}"><path d="M 498 262 C 450 258, 400 250, 372 262 C 350 274, 352 300, 352 330 L 352 420 C 352 500, 356 560, 372 640" fill="none" stroke="#E7A9A0" stroke-width="26" stroke-linecap="round" opacity=".55"/>
      <path d="M 372 640 C 360 690, 420 760, 520 740 C 600 724, 600 660, 540 640 C 500 628, 440 650, 372 640 Z" fill="#F2B8B0" stroke="#D98C82" stroke-width="3"/>
      ${T(560, 790, "Stomach", { size: 24, w: 700, fill: "#B0554A" })}${T(165, 520, "Oesophagus", { size: 22, fill: C.muted, anchor: "end" })}</g>`;
  }
  return g;
}
// clear PVC tube: grey edge, clear body, blue radio-opaque line, black cm markings
const TUBE_STYLE = d => `<path d="${d}" fill="none" stroke="#93A7AE" stroke-width="15" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#F2F8FA" stroke-width="10" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#2F6FD6" stroke-width="2.5"/><path d="${d}" fill="none" stroke="#2A2F33" stroke-width="10" stroke-dasharray="2.5 30"/>`;
function tubeAlong(p) {
  return `<defs><mask id="tmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1120" height="840"><path d="${TUBE_PATH}" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" pathLength="1" stroke-dasharray="${p} 2"/></mask></defs><g mask="url(#tmask)">${TUBE_STYLE(TUBE_PATH)}</g>`;
}
// purple enteral connector with tethered cap, pointing along +x after rotation
function connector(x, y, ang) {
  return `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M -4 -9 L 30 -13 L 64 -21 L 64 21 L 30 13 L -4 9 Z" fill="#C7A9E3" fill-opacity=".9" stroke="#7B4FA0" stroke-width="2.5"/><rect x="60" y="-24" width="14" height="48" rx="4" fill="#7B4FA0"/><path d="M 40 15 C 48 42, 80 46, 92 32" fill="none" stroke="#7B4FA0" stroke-width="5"/><rect x="84" y="20" width="24" height="20" rx="6" fill="#7B4FA0"/></g>`;
}
// external part of the tube from the nostril, ending in the connector
function extTube(d, ex, ey, cx, cy, op = 1) {
  const ang = Math.atan2(ey - cy, ex - cx) * 180 / Math.PI;
  return `<g opacity="${op}">${TUBE_STYLE(d)}${connector(ex, ey, ang)}</g>`;
}
// beige fabric nasal fixation tape: pad on the nose, split tails wrapped around the tube
function noseTape(op = 1) {
  return `<g opacity="${op}"><path d="M 462 222 C 476 224, 498 236, 512 252 L 506 270 C 494 262, 476 254, 458 248 Z" fill="#EFDDBB" stroke="#C9AE7E" stroke-width="2.5"/>${[0, 1, 2].map(i => `<path d="M ${514 + i * 13} ${255 + i * 3} l 9 22" stroke="#EFDDBB" stroke-width="9" stroke-linecap="round"/><path d="M ${514 + i * 13} ${255 + i * 3} l 9 22" stroke="#C9AE7E" stroke-width="1.5" fill="none"/>`).join("")}</g>`;
}
// fabric tape on the cheek holding the tube
function cheekTape(x, y, rot, op = 1) {
  return `<g opacity="${op}" transform="translate(${x} ${y}) rotate(${rot})"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#EFDDBB" stroke="#C9AE7E" stroke-width="2.5"/>${[-24, -12, 0, 12, 24].map(dx => `<line x1="${dx}" y1="-12" x2="${dx}" y2="12" stroke="#DCC69C" stroke-width="2"/>`).join("")}</g>`;
}
// enteral syringe, tip on the left; fill = plunger travel (0..1)
function syringe(x, y, fill) {
  const sx = 70 + 300 * fill;
  let g = `<g transform="translate(${x} ${y})">`;
  g += `<path d="M 0 37 L 42 30 L 42 60 L 0 53 Z" fill="#E9DDF5" stroke="#7B4FA0" stroke-width="3"/>`;
  g += `<rect x="40" y="0" width="360" height="90" rx="10" fill="#F4F9FB" stroke="#8FA3AA" stroke-width="3"/>`;
  if (fill > 0) g += `<rect x="44" y="6" width="${sx - 44}" height="78" fill="#D9C66A" opacity=".85"/>`;
  for (let i = 0; i <= 10; i++) g += `<line x1="${70 + i * 30}" y1="2" x2="${70 + i * 30}" y2="${i % 5 ? 16 : 28}" stroke="#4A5A60" stroke-width="2"/>`;
  [0, 5, 10].forEach(v => g += T(70 + v * 30, -8, String(v), { size: 16, w: 700, anchor: "middle", fill: "#4A5A60" }));
  g += `<rect x="${sx}" y="4" width="22" height="82" rx="6" fill="#3A3F44"/>`;
  g += `<rect x="${sx + 22}" y="37" width="380" height="16" fill="#C7A9E3" stroke="#7B4FA0" stroke-width="2"/><rect x="${sx + 398}" y="4" width="16" height="82" rx="5" fill="#C7A9E3" stroke="#7B4FA0" stroke-width="2"/>`;
  g += `<rect x="394" y="-24" width="16" height="138" rx="6" fill="#C7A9E3" stroke="#7B4FA0" stroke-width="2"/>`;
  return g + `</g>`;
}
function checkCards(rows, lt, x = 80, w = 960, h = 140, gap = 170, top = 110, col = C.green) {
  return rows.map(([hd, sub], i) => {
    const y = top + i * gap, p = seg(lt, 0.3 + i * 0.6, 0.8 + i * 0.6), tk = seg(lt, 0.9 + i * 0.6, 1.2 + i * 0.6);
    return `<g opacity="${p}" transform="translate(${x + (1 - p) * 30} ${y})"><rect width="${w}" height="${h}" rx="20" fill="${col === C.red ? C.redSoft : C.bg}"/>${T(150, sub ? 62 : 82, hd, { size: 36, w: 800 })}${sub ? T(150, 104, sub, { size: 27, fill: C.muted }) : ""}${col === C.red ? cross(70, h / 2, 22, tk) : tick(70, h / 2, 0.6 + 0.6 * tk, tk)}</g>`;
  }).join("");
}
function phStrip(x, y, val, p) {
  const cols = ["#C62828", "#E64A19", "#F57C00", "#FBC02D", "#C0CA33", "#7CB342", "#2E7D32", "#00838F", "#1565C0"];
  let g = `<g transform="translate(${x} ${y})"><rect x="-24" y="-70" width="678" height="290" rx="16" fill="#fff" stroke="#C9D3D6" stroke-width="3"/>${T(0, -36, "pH reference chart", { size: 22, w: 700, fill: C.muted })}`;
  cols.forEach((c, i) => { g += `<rect x="${i * 70}" y="0" width="66" height="60" rx="6" fill="${c}"/>${T(i * 70 + 33, 95, String(i + 1), { size: 24, w: 700, anchor: "middle" })}`; });
  g += `<rect x="-6" y="-12" width="${5 * 70 + 6}" height="84" rx="10" fill="none" stroke="${C.green}" stroke-width="6"/>${T(450, -36, "Safe: pH 0.5 – 5.0", { size: 26, w: 800, anchor: "middle", fill: C.green })}`;
  const mx = (val - 1) * 70 + 33;
  g += `<g opacity="${p}"><path d="M ${mx} 120 l -16 26 h 32 z" fill="${C.ink}"/>${T(mx, 180, "pH " + val, { size: 30, w: 800, anchor: "middle" })}</g>`;
  return g + `</g>`;
}
// pH indicator test strip: white plastic strip, test pad changes colour when wet
function testStrip(x, y, wet, val) {
  const cols = ["#C62828", "#E64A19", "#F57C00", "#FBC02D", "#C0CA33", "#7CB342", "#2E7D32", "#00838F", "#1565C0"];
  const pad = wet > 0 ? cols[val - 1] : "#F3EBC8";
  return `<g transform="translate(${x} ${y})"><rect x="0" y="0" width="300" height="34" rx="6" fill="#fff" stroke="#9AA9AE" stroke-width="2.5"/><rect x="10" y="5" width="44" height="24" rx="4" fill="#F3EBC8"/><rect x="10" y="5" width="44" height="24" rx="4" fill="${pad}" opacity="${wet}"/>${T(170, 24, "pH test strip", { size: 18, w: 700, anchor: "middle", fill: C.muted })}</g>`;
}

add(4.5, { kind: "title" });
add(7, { step: 1, title: ["Know when and", "which tube"], ar: "دواعي الاستخدام واختيار الأنبوب", bullets: ["Decompression, drain gas\nor fluid, medicines, feeds", "Short-term vs long-term tube", "Size by age and purpose", "Extra care: infants, children,\nolder people"], draw: lt => {
  const items = [["Decompress", "Post-op stomach"], ["Drain", "Gas or fluids"], ["Medicines", "Via the tube"], ["Enteral feeds", "Nutrition"]];
  return items.map(([h, s], i) => { const x = 60 + (i % 2) * 510, y = 90 + Math.floor(i / 2) * 340, p = seg(lt, 0.3 + i * 0.5, 0.8 + i * 0.5);
    return `<g opacity="${p}" transform="translate(${x} ${y + (1 - p) * 30})"><rect width="490" height="310" rx="24" fill="${C.tealSoft}"/><circle cx="245" cy="115" r="62" fill="${C.teal}"/>${T(245, 132, String(i + 1), { size: 52, w: 800, anchor: "middle", fill: "#fff" })}${T(245, 235, h, { size: 40, w: 800, anchor: "middle" })}${T(245, 278, s, { size: 28, anchor: "middle", fill: C.muted })}</g>`; }).join("");
} });
add(7, { step: 2, title: ["Prepare for", "insertion"], ar: "التحضير قبل الإدخال", bullets: ["Verify the physician order", "Explain, including the\ndiscomfort to expect", "Emergency, suction and airway\nequipment at the bedside"], draw: lt => checkCards([["Physician order verified", "Right patient, right tube, right purpose"], ["Procedure explained", "Including discomfort during insertion"], ["Emergency equipment ready", "Suction and airway at the bedside"], ["Privacy and position", "Upright, curtains closed"]], lt) });
add(8, { step: 3, title: ["Measure and", "mark the tube"], ar: "قياس الأنبوب وتعليمه", bullets: ["Nose tip → earlobe →\nxiphisternum (NEX)", "Mark the length on the tube", "Check method against\nthe procedural manual"], draw: lt => {
  let g = patient();
  const a = seg(lt, 0.6, 1.8), b = seg(lt, 2.0, 3.4);
  const p1 = { x: lerp(NOSE.x, EAR.x, a), y: lerp(NOSE.y, EAR.y + 20, a) }, p2 = { x: lerp(EAR.x, XIPH.x, b), y: lerp(EAR.y + 20, XIPH.y, b) };
  g += `<line x1="${NOSE.x}" y1="${NOSE.y}" x2="${p1.x}" y2="${p1.y}" stroke="${C.teal}" stroke-width="6" stroke-dasharray="14 10"/>`;
  if (b > 0) g += `<line x1="${EAR.x}" y1="${EAR.y + 20}" x2="${p2.x}" y2="${p2.y}" stroke="${C.teal}" stroke-width="6" stroke-dasharray="14 10"/>`;
  [[NOSE, "N", 0.3], [{ x: EAR.x, y: EAR.y + 20 }, "E", 1.7], [XIPH, "X", 3.3]].forEach(([pt, l, t0]) => { const q = seg(lt, t0, t0 + 0.4); g += `<g opacity="${q}"><circle cx="${pt.x}" cy="${pt.y}" r="22" fill="${C.teal}"/>${T(pt.x, pt.y + 9, l, { size: 26, w: 800, anchor: "middle", fill: "#fff" })}</g>`; });
  const m = seg(lt, 4.0, 5.0);

  g += `<g opacity="${seg(lt, 4.2, 4.8)}" transform="translate(720 560)"><rect width="330" height="150" rx="16" fill="${C.bg}"/>${T(24, 50, "Record", { size: 26, w: 800, fill: C.teal })}${T(24, 92, "Marking: 55 cm", { size: 28, w: 700 })}${T(24, 130, "Nostril: left", { size: 28, w: 700 })}</g>`;
  return g;

add(6, { step: 8, title: ["Secure the", "tube"], ar: "تثبيت الأنبوب", bullets: ["Secure as per the\nprocedural manual", "No pressure on the nostril", "Check the mark stays\nat the nostril"], draw: lt => {

add(9, { step: 9, title: ["Before every", "feed or medicine"], ar: "قبل كل وجبة أو دواء", bullets: ["Check the mark hasn't moved", "Continuous feeds: check\nevery 4–6 hours", "Stop feed 30–60 min, flush\n20 ml air, aspirate, test pH"], draw: lt => {

  st.forEach(([h, s], i) => { const x = 40 + i * 212, p = seg(lt, 0.5 + i * 0.8, 1.0 + i * 0.8);
    g += `<g opacity="${p}" transform="translate(${x} ${260 + (1 - p) * 30})"><rect width="190" height="260" rx="22" fill="${i === 4 ? C.greenSoft : C.bg}"/><circle cx="95" cy="70" r="40" fill="${i === 4 ? C.green : C.teal}"/>${T(95, 86, String(i + 1), { size: 40, w: 800, anchor: "middle", fill: "#fff" })}${T(95, 168, h, { size: 30, w: 800, anchor: "middle" })}${T(95, 210, s, { size: 26, anchor: "middle", fill: C.muted })}</g>`;
    if (i < 4) g += `<g opacity="${p}">${arrow(x + 192, 390, x + 210, 390, C.muted, 4)}</g>`; });

  const rows = [["Ordered by / time", "Dr name · 30/10 09:00"], ["Inserted", "30/10 · 09:40"], ["Tube type / size", "Short-term · 14 Fr"], ["Marking / nostril", "55 cm · left"], ["Placement check", "Aspirate pH 4 · X-ray OK"], ["Patient response", "Tolerated, no distress"], ["Handover", "Marking told to next shift"]];
  let g = `<rect x="140" y="60" width="840" height="740" rx="24" fill="${C.bg}"/><rect x="390" y="30" width="340" height="60" rx="14" fill="${C.ink}"/>${T(560, 72, "NG tube record", { size: 28, w: 700, anchor: "middle", fill: "#fff" })}`;
  rows.forEach(([h, v], i) => { const y = 140 + i * 92, p = seg(lt, 0.3 + i * 0.5, 0.7 + i * 0.5); g += `${T(190, y + 30, h, { size: 26, fill: C.muted })}<line x1="520" y1="${y + 42}" x2="930" y2="${y + 42}" stroke="${C.line}" stroke-width="3"/><g opacity="${p}">${T(520, y + 30, v, { size: 28, w: 700, fill: C.teal })}</g>`; });
  return g;

add(5, { kind: "end" });

const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const STEPS = SCENES.filter(s => s.step).length;

function textPanel(s, lt) {
  const p = seg(lt, 0, 0.5);
  let g = `<g opacity="${p}" transform="translate(${(1 - p) * 40} 0)">`;
  g += `<circle cx="1294" cy="200" r="46" fill="${s.warn ? C.red : C.teal}"/>${T(1294, 216, s.warn ? "!" : String(s.step), { size: 44, w: 800, anchor: "middle", fill: "#fff" })}`;
  let y = 330;
  s.title.forEach(l => { g += T(1248, y, l, { size: 62, w: 800 }); y += 72; });
  y += 40;
  if (s.crit) g += `<rect x="1362" y="174" width="300" height="52" rx="26" fill="${C.red}"/>${T(1512, 210, "CRITICAL POINT", { size: 26, w: 800, fill: "#fff", anchor: "middle", ls: 2 })}`;
  g += `</g>`;
  s.bullets.forEach((b, i) => {
    const q = seg(lt, 0.6 + i * 0.5, 1.0 + i * 0.5);
    g += `<g opacity="${q}"><rect x="1250" y="${y - 22}" width="14" height="14" rx="3" fill="${s.warn ? C.red : C.teal}"/>`;
    b.split("\n").forEach(l => { g += T(1284, y, l, { size: 34, w: 500 }); y += 46; });
    g += `</g>`; y += 22;
  });
  return g;
}
function chrome(s) {
  let g = `${T(60, 72, "NG TUBE", { size: 24, w: 800, fill: C.teal, ls: 3 })}${T(210, 72, "·  Ward Procedure Library", { size: 24, fill: C.muted })}`;
  g += `<g><rect x="1640" y="40" width="220" height="44" rx="22" fill="#FFF1D1"/>${T(1750, 70, "Draft for review", { size: 22, w: 700, fill: "#8A5A00", anchor: "middle" })}</g>`;
  const x0 = 80, x1 = 1840, y = 1030;
  g += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/>`;
  const cur = s.step || 0;
  const xc = x0 + (x1 - x0) * Math.max(0, cur - 1) / (STEPS - 1);
  if (cur) g += `<line x1="${x0}" y1="${y}" x2="${xc}" y2="${y}" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = 1; i <= STEPS; i++) { const x = x0 + (x1 - x0) * (i - 1) / (STEPS - 1); g += `<circle cx="${x}" cy="${y}" r="${i === cur ? 13 : 8}" fill="${i <= cur ? C.teal : "#C3D0D3"}" ${i === cur ? `stroke="#fff" stroke-width="4"` : ""}/>`; }
  return g;
}
function titleScene(lt, end) {
  const p = seg(lt, 0, 0.8), q = seg(lt, 0.6, 1.4), r = seg(lt, 1.2, 2.0);
  let g = `<rect width="1920" height="1080" fill="${C.teal}"/><circle cx="1600" cy="540" r="${520 + 20 * Math.sin(lt)}" fill="#fff" opacity=".05"/>`;
  if (!end) {
    g += `<g opacity="${p}" transform="translate(0 ${(1 - p) * 30})">${T(140, 330, "WARD PROCEDURE LIBRARY", { size: 30, w: 700, fill: "#BFE6E6", ls: 6 })}${T(140, 460, "Nasogastric", { size: 120, w: 800, fill: "#fff" })}${T(140, 590, "tube (NGT)", { size: 120, w: 800, fill: "#fff" })}</g>`;
    g += `<g opacity="${q}">${T(144, 680, "Insertion, care and removal · step by step", { size: 44, fill: "#E3F4F4" })}</g>`;
    g += `<g opacity="${r}" transform="translate(${1350 + (1 - r) * 80} 520)"><path d="M-180 -40 C -60 -260, 220 -200, 180 -20 S -120 160, -40 -60 S 220 -60, 120 120 S -200 220, -220 60" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/><path d="M-180 -40 C -60 -260, 220 -200, 180 -20 S -120 160, -40 -60 S 220 -60, 120 120 S -200 220, -220 60" fill="none" stroke="${C.tealSoft || '#BFE6E6'}" stroke-width="4" stroke-dasharray="2 22" stroke-linecap="round"/><g transform="translate(-220 60) rotate(110)"><rect x="-22" y="-20" width="70" height="40" rx="10" fill="${C.amber || '#F2B33D'}"/><rect x="40" y="-12" width="30" height="24" rx="6" fill="#fff"/></g></g>`;
    g += `<g opacity="${r}">${T(144, 960, "Draft for review · Module 04 · RMS.NCC.MW.F.007 · follow the NGT procedural manual", { size: 26, fill: "#BFE6E6" })}</g>`;
  } else {
    g += `<g opacity="${p}">${T(960, 380, "Watch  ·  Quiz  ·  Get signed off", { size: 84, w: 800, fill: "#fff", anchor: "middle" })}</g>`;
    g += `<g opacity="${r}">${T(960, 640, "Practise on a manikin first, then under supervision.", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 700, "Always follow the NG tube procedural manual (Module 04).", { size: 36, fill: "#E3F4F4", anchor: "middle" })}${T(960, 900, "Ward Procedure Library · Draft for review", { size: 26, fill: "#BFE6E6", anchor: "middle" })}</g>`;
  }
  return g;
}

window.TOTAL = TOTAL;
window.drawFrame = (t) => {
  let acc = 0, s = SCENES[SCENES.length - 1], lt = 0;
  for (const sc of SCENES) { if (t < acc + sc.dur) { s = sc; lt = t - acc; break; } acc += sc.dur; }
  if (t >= TOTAL) lt = s.dur;
  let g = `<rect width="1920" height="1080" fill="${C.bg}"/>`;
  if (s.kind === "title") g += titleScene(lt, false);
  else if (s.kind === "end") g += titleScene(lt, true);
  else {
    g += chrome(s);
    g += `<defs><clipPath id="card"><rect x="0" y="0" width="1120" height="840" rx="28"/></clipPath></defs>`;
    g += `<g transform="translate(60 130)"><rect width="1120" height="840" rx="28" fill="#fff" stroke="${C.line}" stroke-width="2"/><g clip-path="url(#card)">${s.draw(lt)}</g></g>`;
    g += textPanel(s, lt);
  }
  // fade from previous scene
  const fin = clamp(lt / 0.35), fout = clamp((s.dur - lt) / 0.35);
  const veil = 1 - Math.min(fin, fout);
  if (veil > 0.001) g += `<rect width="1920" height="1080" fill="${C.bg}" opacity="${veil}"/>`;
  document.getElementById("root").innerHTML = g;
};
window.drawFrame(0);
</script>
