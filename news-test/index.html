<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEWS Knowledge Check</title>
<style>
/* Layout: one narrow working column; a 4-step track at the top; one task per screen */
:root{
  --bg:#f3f7f8; --surface:#ffffff; --ink:#17324d; --muted:#5b6d7c; --line:#d3e0e5;
  --accent:#087e8b; --accent-soft:#e1f1f3; --good:#2b8a57; --good-soft:#e2f4ea; --bad:#c23b3b; --bad-soft:#fbe5e5; --amber:#b86e00;
  --f-display:"Space Grotesk","Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b24; --surface:#16252f; --ink:#e3edf2; --muted:#9db0bd; --line:#2a3d4a;
  --accent:#3fb5c1; --accent-soft:#173842; --good:#5cc68a; --good-soft:#173528; --bad:#ef7b7b; --bad-soft:#3b1f22; --amber:#f0b44c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b24; --surface:#16252f; --ink:#e3edf2; --muted:#9db0bd; --line:#2a3d4a;
  --accent:#3fb5c1; --accent-soft:#173842; --good:#5cc68a; --good-soft:#173528; --bad:#ef7b7b; --bad-soft:#3b1f22; --amber:#f0b44c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--f-display);font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 22px}
.track div{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.track div::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.track div.done::before{background:var(--accent)}
.track div.now{color:var(--ink)}
.track div.now::before{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:10px;padding:13px 18px;font-weight:700;border:1px solid transparent}
.primary{background:var(--accent);color:var(--surface)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.qbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--accent)}
.qtext{font-size:19px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);font-weight:500;padding:13px 14px}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] b{background:var(--accent);border-color:var(--accent);color:var(--surface)}
video{width:100%;max-width:100%;border-radius:10px;background:#000;aspect-ratio:16/9}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.score span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.score strong{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700}
.pass{background:var(--good-soft);color:var(--good)}.fail{background:var(--bad-soft);color:var(--bad)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-left:5px solid var(--good);border-radius:10px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.rv.wrong{border-left-color:var(--bad)}
.rv .ok{color:var(--good);font-weight:600}.rv .no{color:var(--bad);font-weight:600}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;user-select:all;overflow-wrap:anywhere}
.test .qtext,.test .opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px;border:1.5px dashed var(--line);border-radius:12px}.play{font-size:17px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}.timer.low{color:var(--bad)}
.err{color:var(--bad);font-size:14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head><body>

<div class="wrap">
  <header>
    <div class="eyebrow">EWS project · Staff education</div>
    <h1>NEWS Knowledge Check</h1>
    <div class="muted">Pre-test, training video (Patient cases A–G), then the same test again. About 15 minutes.</div>
  </header>
  <div class="track" id="track"><div>1 · Pre-test</div><div>2 · Video</div><div>3 · Post-test</div><div>4 · Result</div></div>
  <main id="app"></main>
  <p style="margin-top:28px;text-align:center;font-size:13px"><a id="adminlink" href="admin.html" style="color:var(--muted)">🔒 Admin (EWS project team)</a></p>
</div>

<script src="../config.js"></script>

const L = "ABCD";
const S = { step:"start", id:"", ward:"", role:"", phase:"pre", i:0, pre:Array(Q.length).fill(null), post:Array(Q.length).fill(null), videoDone:false, start:null };
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const score = arr => arr.reduce((n,a,i)=>n+(a===Q[i].a?1:0),0);

// ---- results to the QI team's results store (queued on the phone if offline) ----
const HAS_SERVER = typeof RESULTS_URL !== "undefined" && !!RESULTS_URL;
const OUTBOX = "news-outbox";
let outbox = []; try { outbox = JSON.parse(localStorage.getItem(OUTBOX) || "[]"); } catch (e) {}
const keep = () => { try { localStorage.setItem(OUTBOX, JSON.stringify(outbox)); } catch (e) {} };
let sending = false;
function flush(){
  if(!HAS_SERVER || sending || !outbox.length) return;
  sending = true; const item = outbox[0];
  fetch(RESULTS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(item)})
    .then(()=>{ outbox = outbox.filter(x => x.uid !== item.uid); keep(); sending = false; flush(); })
    .catch(()=>{ sending = false; });   // stays queued; retried when back online or next visit
}
function sendPhase(ph){
  if(!HAS_SERVER) return;
  const arr = S[ph];
  outbox.push({ test:"news", uid:S.session+ph, id:S.id, ward:S.ward, role:S.role, stage:ph==="pre"?"PRE":"POST", session:S.session,
    score:score(arr), ans:arr.map(a => a===null ? "-" : L[a]) });
  keep(); flush();
}
window.addEventListener("online", flush);
flush();
if (HAS_SERVER) document.getElementById("adminlink").href = RESULTS_URL + "?view=newsadmin";

function setTrack(){
  const m={start:["","","",""],between:["done","now","",""],video:["done","now","",""],result:["done","done","done","done"]};
  const st=S.step==="test"?(S.phase==="pre"?["now","","",""]:["done","done","now",""]):m[S.step];
  document.querySelectorAll("#track div").forEach((d,i)=>d.className=st[i]);
}

function render(){
  setTrack();
  if(S.step==="start") return renderStart();
  if(S.step==="test") return renderQ();
  if(S.step==="between") return renderBetween();
  if(S.step==="video") return renderVideo();
  if(S.step==="result") return renderResult();
}

function renderStart(){
  app.innerHTML = `<form class="panel" id="f">
    <h2>Before you start</h2>
    <div class="muted">Turn on the sound or use headphones: each question is spoken, not shown, and you can replay it twice. Answer on your own, without looking anything up. You have 45 seconds after each question, and the order is different for every person. Then watch the video and answer the same questions again.</div>
    <label for="sid">Staff ID<input id="sid" required autocomplete="off" value="${esc(S.id)}" placeholder="e.g. 102345"></label>
    <div class="row">
      <label for="ward">Ward<select id="ward" required>
        <option value="">Choose…</option>${["3A","3C","3D","4A","4B","4C","4D","Other"].map(w=>`<option ${S.ward===w?"selected":""}>${w}</option>`).join("")}
      </select></label>
      <label for="role">Role<select id="role" required>
        <option value="">Choose…</option>${["RN","PCA","Other"].map(w=>`<option ${S.role===w?"selected":""}>${w}</option>`).join("")}
      </select></label>
    </div>
    <div class="muted" style="font-size:13px">${HAS_SERVER?"Your staff ID, ward, role and answers are saved for the EWS project team, to find which topics need more teaching. No names are collected.":""}</div>
    <div id="msg" class="err" hidden></div>
    <div class="actions"><span></span><button class="primary" type="submit">Start pre-test</button></div>
  </form>`;
  document.getElementById("f").addEventListener("submit", e=>{
    e.preventDefault();
    S.id=document.getElementById("sid").value.trim(); S.ward=document.getElementById("ward").value; S.role=document.getElementById("role").value;
    if(!S.id||!S.ward||!S.role){const m=document.getElementById("msg");m.textContent="Enter your staff ID, ward and role to start.";m.hidden=false;return}
    S.start=new Date(); S.session=Date.now().toString(36)+Math.random().toString(36).slice(2,6); startPhase("pre");
  });
}

const SECS = 45;
let timer = null;
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startPhase(ph){S.phase=ph;S.i=0;S.order=shuffle(Q.length).map(qi=>({qi,perm:shuffle(Q[qi].o.length)}));S.step="test";render();window.scrollTo(0,0)}
function advance(){
  clearInterval(timer); if(curAudio){curAudio.pause();curAudio=null}
  if(S.i<Q.length-1){S.i++;renderQ();return}
  sendPhase(S.phase);
  S.step = S.phase==="pre" ? "between" : "result"; render(); window.scrollTo(0,0);
}
function renderQ(){
  clearInterval(timer);
  const arr = S[S.phase], {qi,perm} = S.order[S.i], q = Q[qi];
  app.innerHTML = `<section class="panel test" data-qi="${qi}">
    <div class="qhead"><span>${S.phase==="pre"?"Pre-test":"Post-test"} · Question ${S.i+1} of ${Q.length}</span><span class="timer" id="tm">${SECS}s after the question</span></div>
    <div class="qbar"><i id="tbar" style="width:100%"></i></div>
    <div class="listen"><button type="button" class="ghost play" id="play">▶ Play question</button><span class="muted" id="plays">Replays left: 2</span></div>
    <div class="opts">${perm.map((j,k)=>`<button type="button" class="opt" data-j="${j}" aria-pressed="${arr[qi]===j}"><b>${L[k]}</b><span>${esc(q.o[j])}</span></button>`).join("")}</div>
    <div class="actions"><span class="muted" style="font-size:13px">You have 45 seconds after the question ends.</span>
      <button class="primary" id="next" type="button" ${arr[qi]===null?"disabled":""}>${S.i===Q.length-1?"Finish "+(S.phase==="pre"?"pre-test":"post-test"):"Next"}</button>
    </div></section>`;
  app.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>{arr[qi]=+btn.dataset.j;
    app.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",o===btn));document.getElementById("next").disabled=false}));
  document.getElementById("next").onclick=advance;
  const au=new Audio(QA[qi]); let replays=2, started=false;
  const pb=document.getElementById("play"), pl=document.getElementById("plays");
  const startTimer=()=>{ if(started) return; started=true; runTimer(); };
  au.addEventListener("ended",()=>{startTimer(); pb.disabled=replays<=0; pb.textContent=replays>0?"↻ Replay question":"No replays left"});
  au.addEventListener("error",startTimer);
  pb.onclick=()=>{ if(au.paused&&au.currentTime>0&&!au.ended){au.play();return}
    if(started||au.ended){ if(replays<=0) return; replays--; pl.textContent="Replays left: "+replays; }
    au.currentTime=0; au.play().catch(startTimer); pb.disabled=true; pb.textContent="🔊 Playing…"; };
  au.play().then(()=>{pb.disabled=true;pb.textContent="🔊 Playing…"}).catch(()=>{pb.textContent="▶ Tap to hear the question"});
  curAudio=au;
}
let curAudio=null;
function runTimer(){
  const end=Date.now()+SECS*1000;
  timer=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    const tm=document.getElementById("tm"),tb=document.getElementById("tbar"); if(!tm){clearInterval(timer);return}
    tm.textContent=left+"s"; tm.classList.toggle("low",left<=10); tb.style.width=(left/SECS*100)+"%";
    if(left<=0) advance();},250);
}
function renderBetween(){
  app.innerHTML = `<section class="panel">
    <h2>Pre-test done</h2>
    <div class="scores"><div class="score"><span>Pre-test</span><strong>${score(S.pre)}/10</strong></div></div>
    <div class="muted">You will see which answers were right at the end. Now watch the training video. The post-test opens when the video ends.</div>
    <div class="actions"><span></span><button class="primary" id="go" type="button">Watch the video</button></div></section>`;
  document.getElementById("go").onclick=()=>{S.step="video";render()};
}

function renderVideo(){
  app.innerHTML = `<section class="panel">
    <h2>Training video: Patient cases A–G</h2>
    <div class="muted">About 6½ minutes. Seven patients: scoring, the red score, escalation thresholds, clinical concern, and oxygen with SpO₂ Scale 2.</div>
    <video id="v" controls playsinline preload="metadata" src="${VIDEO}"><track kind="captions" srclang="en" label="English" src="${VTT}" default></video>
    <div class="note" id="vnote">${S.videoDone?"Video finished. You can start the post-test.":"Watch to the end to open the post-test. Captions are on."}</div>
    <div class="actions"><span></span><button class="primary" id="go" type="button" ${S.videoDone?"":"disabled"}>Start post-test</button></div></section>`;
  const v=document.getElementById("v");
  v.addEventListener("ended",()=>{S.videoDone=true;document.getElementById("go").disabled=false;document.getElementById("vnote").textContent="Video finished. You can start the post-test."});
  document.getElementById("go").onclick=()=>startPhase("post");
}

function resultLine(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  const ds=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  return `NEWS Knowledge Check | Staff ID ${S.id} | Ward ${S.ward} | ${S.role} | ${ds} | Pre ${score(S.pre)}/10 | Post ${score(S.post)}/10`;
}

function renderResult(){
  const pre=score(S.pre), post=score(S.post), ch=post-pre, pass=post>=8;
  app.innerHTML = `<section class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Your result</h2><span class="pill ${pass?"pass":"fail"}">${pass?"Passed (8/10 or more)":"Below 8/10: review the video"}</span></div>
    <div class="scores">
      <div class="score"><span>Pre-test</span><strong>${pre}/10</strong></div>
      <div class="score"><span>Post-test</span><strong>${post}/10</strong></div>
      <div class="score"><span>Change</span><strong style="color:var(${ch>0?"--good":ch<0?"--bad":"--ink"})">${ch>0?"+":""}${ch}</strong></div>
    </div>
    <div>
      <div style="font-weight:700;margin-bottom:6px">Your result record</div>
      <div class="code" id="code">${esc(resultLine())}</div>
    </div>
    <div class="note">${HAS_SERVER?"Your result is saved for the EWS project team. You can also show this screen to your team leader.":"Show this screen to your team leader, or copy the record and send it to the NEWS educator."}</div>
    <div class="actions"><button class="ghost" id="again" type="button">New staff member</button><button class="primary" id="copy" type="button">Copy result</button></div>
    <div id="copied" class="muted" hidden>Copied.</div>
  </section>
  <section class="panel" style="margin-top:16px">
    <h2>Answers (post-test)</h2>
    <div class="review">${Q.map((q,i)=>{const ok=S.post[i]===q.a;return `<div class="rv ${ok?"":"wrong"}">
      <div><b>${i+1}.</b> ${esc(q.q)}</div>
      ${ok?`<div class="ok">Correct: ${esc(q.o[q.a])}</div>`:`<div class="no">Your answer: ${S.post[i]===null?"none":esc(q.o[S.post[i]])}</div><div class="ok">Correct: ${esc(q.o[q.a])}</div>`}
      <div class="muted">Covered in: ${esc(q.r)}</div></div>`}).join("")}</div>
  </section>`;
  document.getElementById("copy").onclick=async()=>{
    const t=resultLine();
    try{await navigator.clipboard.writeText(t);document.getElementById("copied").hidden=false}
    catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=getSelection();s.removeAllRanges();s.addRange(r);document.getElementById("copied").textContent="Selected. Copy it from your device menu.";document.getElementById("copied").hidden=false}
  };
  document.getElementById("again").onclick=()=>{Object.assign(S,{step:"start",id:"",ward:"",role:"",phase:"pre",i:0,pre:Array(Q.length).fill(null),post:Array(Q.length).fill(null),videoDone:false});render();window.scrollTo(0,0)};
}
document.addEventListener("copy",e=>{if(e.target.closest&&e.target.closest(".test"))e.preventDefault()});
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".test"))e.preventDefault()});
render();
</script>

</body></html>
